<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="utf-8"/>
<meta name="viewport" content="width=device-width, initial-scale=1.0, user-scalable=no, maximum-scale=1.0"/>
<title>XPO — Registro de Plataformas</title>
<style>
*,
*:before,
*:after{box-sizing:border-box}
html,h1,h2,h3,h4,p{margin:0}
img,svg,video{display:block;max-width:100%}
button,input,textarea,select{font:inherit;font-size:16px}
button{-webkit-tap-highlight-color:transparent;touch-action:manipulation}
a,a:visited,a:hover,a:active{text-decoration:none!important;color:inherit}

:root{
  --accent:#0A84FF;
  --bg:#F5F6F7;
  --panel:#FFFFFF;
  --line:rgba(0,0,0,.06);
  --text:#111418;
  --muted:#6A6F75;
  --ok:#34C759;

  --state-empty-bg:rgba(33,131,255,.10);
  --state-empty-border:rgba(33,131,255,.22);
  --state-empty-text:#1564C0;

  --state-loaded-bg:rgba(0,180,135,.10);
  --state-loaded-border:rgba(0,180,135,.22);
  --state-loaded-text:#0A8369;

  --state-broken-bg:rgba(241,184,58,.12);
  --state-broken-border:rgba(241,184,58,.22);
  --state-broken-text:#8F6200;

  --radius-sm:12px;
  --radius-md:16px;
  --radius-lg:20px;
  --radius-xl:22px;

  --shadow-1:0 4px 12px rgba(0,0,0,.05);
  --shadow-2:0 10px 28px rgba(0,0,0,.06);
  --ease-snap:cubic-bezier(.22,1,.36,1);
  --ease-soft:cubic-bezier(.25,.8,.25,1);
  --blur:18px;

  --space-xxs:4px;
  --space-xs:8px;
  --space-sm:12px;
  --space-md:16px;
  --space-lg:20px;
  --space-xl:28px;
}

html{
  -webkit-font-smoothing:antialiased;
  -moz-osx-font-smoothing:grayscale;
  text-rendering:optimizeLegibility;
  scroll-behavior:smooth;
}

body{
  margin:0;
  min-height:100%;
  font-family:-apple-system,BlinkMacSystemFont,"SF Pro Text","Inter",system-ui,sans-serif;
  line-height:1.46;
  color:var(--text);
  background:linear-gradient(to bottom,#ffffff 0%,#f2f3f7 70%,#eaecf2 100%);
}

@media (prefers-reduced-motion: reduce){
  *,
  *:before,
  *:after{
    animation-duration:.001ms!important;
    animation-iteration-count:1!important;
    transition-duration:.001ms!important;
    scroll-behavior:auto!important
  }
}

input,textarea{
  width:100%;
  display:block;
  max-width:100%;
  background:linear-gradient(145deg,rgba(255,255,255,.85),rgba(245,246,250,.95));
  border:1px solid #E5E6E7;
  border-radius:12px;
  padding:10px 14px;
  color:var(--text);
  box-shadow:inset 0 2px 4px rgba(255,255,255,.8),inset 0 -2px 6px rgba(220,220,230,.4),0 2px 6px rgba(0,0,0,.04);
  transition:all .2s ease;
}
input:hover,textarea:hover,select:hover{
  box-shadow:inset 0 2px 6px rgba(255,255,255,.9),inset 0 -3px 8px rgba(220,220,230,.5),0 3px 10px rgba(0,0,0,.06)
}
input:focus,textarea:focus,select:focus{
  outline:none;
  border-color:var(--accent);
  box-shadow:inset 0 2px 6px rgba(255,255,255,1),inset 0 -3px 10px rgba(220,220,230,.6),0 0 0 3px rgba(10,132,255,.20),0 3px 10px rgba(0,0,0,.08)
}
textarea{min-height:88px;max-height:220px;resize:vertical}
select{appearance:none;background-image:linear-gradient(145deg,rgba(255,255,255,.85),rgba(245,246,250,.95))}

button{
  display:inline-flex;
  align-items:center;
  justify-content:center;
  gap:8px;
  min-height:48px;
  padding:0 18px;
  border:1px solid rgba(255,255,255,.7);
  border-radius:14px;
  background:linear-gradient(150deg,rgba(255,255,255,.90),rgba(240,240,245,.95));
  color:var(--text);
  font-weight:600;
  box-shadow:inset 0 1px 3px rgba(255,255,255,.85),inset 0 6px 12px rgba(255,255,255,.25),0 10px 18px rgba(0,0,0,.05),0 3px 8px rgba(0,0,0,.03);
  transition:all .25s ease;
}
button:hover{
  transform:translateY(-1px);
  box-shadow:inset 0 2px 5px rgba(255,255,255,1),inset 0 8px 14px rgba(255,255,255,.35),0 12px 26px rgba(0,0,0,.07),0 4px 10px rgba(0,0,0,.04)
}
button:active{transform:scale(.97);opacity:.9}
button:disabled{opacity:.6;transform:none}

.app{
  max-width:1040px;
  margin:0 auto;
  padding:calc(18px + env(safe-area-inset-top)) 16px calc(28px + env(safe-area-inset-bottom)) 16px;
}
.main-container,.card,.record,.group,.step-panel{
  margin-left:auto;
  margin-right:auto;
  max-width:440px;
}

.header{
  position:sticky;
  top:12px;
  z-index:10;
  border-radius:22px;
  padding:18px 20px;
  background:rgba(255,255,255,.28);
  border:1px solid rgba(255,255,255,.35);
  backdrop-filter:blur(18px) saturate(180%);
  -webkit-backdrop-filter:blur(18px) saturate(180%);
  box-shadow:0 8px 24px rgba(0,0,0,.06);
  overflow:hidden;
  isolation:isolate;
  transform:translateZ(0);
}
