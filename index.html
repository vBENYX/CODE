<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="utf-8"/>
<meta content="width=device-width, initial-scale=1.0, user-scalable=no, maximum-scale=1.0" name="viewport"/>
<title>XPO — Registro de Plataformas</title>
<script src="https://cdnjs.cloudflare.com/ajax/libs/jspdf/2.5.1/jspdf.umd.min.js"></script>
<style>
/* ─── RESET & BASE ──────────────────────────────────────────── */
*{box-sizing:border-box;text-decoration:none!important}
html,h1,h2,h3,h4,p{margin:0}
button,input,textarea,select{font:inherit}
img,svg,video{display:block;max-width:100%}
button{touch-action:manipulation;-webkit-tap-highlight-color:transparent;-webkit-user-select:none;user-select:none}

/* ─── TOKENS ────────────────────────────────────────────────── */
:root{
  --accent:#0A84FF;
  --accent-deep:#0066CC;
  --bg:#F2F3F7;
  --panel:#FFFFFF;
  --line:#E6E6EA;
  --text:#111418;
  --muted:#6A6F75;
  --radius:18px;
  --radius-sm:12px;
  --ok:#34C759;
  --warn:#FF9F0A;
  --danger:#FF3B30;
  --shadow-card:0 2px 8px rgba(0,0,0,.04), 0 8px 24px rgba(0,0,0,.06);
  --shadow-float:0 8px 32px rgba(0,0,0,.12), 0 2px 8px rgba(0,0,0,.06);
  --shadow-btn:0 1px 3px rgba(0,0,0,.04), 0 4px 14px rgba(0,0,0,.06), inset 0 1px 0 rgba(255,255,255,.8);
  --shadow-btn-hover:0 2px 6px rgba(0,0,0,.06), 0 8px 22px rgba(0,0,0,.10), inset 0 1px 0 rgba(255,255,255,.9);
  --shadow-btn-primary:0 2px 8px rgba(10,132,255,.30), 0 6px 20px rgba(10,132,255,.18), inset 0 1px 0 rgba(255,255,255,.22);
  --shadow-btn-primary-hover:0 4px 14px rgba(10,132,255,.40), 0 8px 28px rgba(10,132,255,.22), inset 0 1px 0 rgba(255,255,255,.28);
  --glass:rgba(255,255,255,.72);
  --blur:20px;
  --ease-spring:cubic-bezier(.34,1.56,.64,1);
  --ease-snap:cubic-bezier(.22,1,.36,1);
  --ease-soft:cubic-bezier(.25,.8,.25,1);
  --ease-out:cubic-bezier(.16,1,.3,1);
  --t-fast:160ms;
  --t-mid:280ms;
  --t-slow:440ms;
}

/* ─── REDUCED MOTION ────────────────────────────────────────── */
@media(prefers-reduced-motion:reduce){
  *{animation-duration:.001ms!important;animation-iteration-count:1!important;transition-duration:.001ms!important;scroll-behavior:auto!important}
}

/* ─── TYPOGRAPHY & RENDERING ────────────────────────────────── */
html{
  -webkit-font-smoothing:antialiased;
  -moz-osx-font-smoothing:grayscale;
  text-rendering:optimizeLegibility;
  scroll-behavior:smooth;
  font-size:16px;
}
body{
  font-family:-apple-system,BlinkMacSystemFont,"SF Pro Text","SF Pro Display",system-ui,sans-serif;
  color:var(--text);
  background:linear-gradient(180deg,#ffffff 0%,#f2f3f7 60%,#eaecf2 100%);
  min-height:100vh;
  line-height:1.46;
}
input,textarea,button,select{font-size:16px;line-height:1.46}

/* ─── LAYOUT ─────────────────────────────────────────────────── */
.app{
  max-width:1040px;
  margin:0 auto;
  padding:calc(18px + env(safe-area-inset-top)) 16px calc(28px + env(safe-area-inset-bottom));
  background:transparent;
}

/* ─── HEADER ─────────────────────────────────────────────────── */
.header{
  position:sticky;top:12px;z-index:10;
  border-radius:22px;padding:18px 20px;
  background:var(--glass);
  border:1px solid rgba(120,120,140,.20);
  backdrop-filter:saturate(1.6) blur(var(--blur));
  -webkit-backdrop-filter:saturate(1.6) blur(var(--blur));
  box-shadow:var(--shadow-float);
  overflow:hidden;isolation:isolate;
  transform:translateZ(0);
  transition:box-shadow var(--t-mid) var(--ease-soft),
             backdrop-filter var(--t-mid) var(--ease-soft);
}
.header::before{
  content:"";position:absolute;inset:0;
  background:linear-gradient(180deg,rgba(10,132,255,.08),transparent 55%);
  pointer-events:none;
}
body.scrolled .header{
  box-shadow:0 8px 32px rgba(0,0,0,.12);
  backdrop-filter:saturate(2) blur(28px);
  -webkit-backdrop-filter:saturate(2) blur(28px);
}
.brand{display:flex;align-items:center;justify-content:center;gap:10px;font-weight:500;letter-spacing:.08em}
.chip{
  position:relative;overflow:hidden;
  background:rgba(255,255,255,.75);
  border:1px solid rgba(0,0,0,.06);
  padding:5px 10px;border-radius:10px;
  font-weight:800;font-size:13px;
  backdrop-filter:saturate(1.8) blur(8px);
  box-shadow:inset 0 0 0 0.5px rgba(255,255,255,.65),0 2px 6px rgba(0,0,0,.06);
  letter-spacing:.06em;
}
.chip::after{
  content:"";position:absolute;top:-50%;left:-30%;width:60%;height:200%;
  background:linear-gradient(120deg,rgba(255,255,255,0) 0%,rgba(255,255,255,.65) 50%,rgba(255,255,255,0) 100%);
  transform:rotate(12deg);
  animation:shimmer 3.6s infinite linear;
  pointer-events:none;
}
@keyframes shimmer{
  0%{transform:translateX(-120%) rotate(12deg)}
  100%{transform:translateX(220%) rotate(12deg)}
}
.logo-svg{display:flex;align-items:center}
.headline{
  margin:4px 0 2px;text-align:center;
  font-weight:500;font-size:clamp(18px,3vw,24px);
  color:var(--muted);letter-spacing:.01em;
}

/* ─── CARD ───────────────────────────────────────────────────── */
.card{
  background:#FFFFFF;
  border:1px solid rgba(0,0,0,.06);
  border-radius:var(--radius);
  box-shadow:var(--shadow-card);
  margin:18px 0;
  overflow:hidden;
  transform:translateZ(0);
  transition:box-shadow var(--t-mid) var(--ease-soft),
             transform var(--t-mid) var(--ease-soft);
  scroll-margin-top:14px;
}
.card:hover{
  box-shadow:var(--shadow-float);
  transform:translateY(-2px) translateZ(0);
}
.card-header{
  display:flex;align-items:center;justify-content:space-between;gap:8px;
  padding:12px 18px;
  border-bottom:1px solid var(--line);
  background:linear-gradient(180deg,rgba(251,251,253,1),rgba(255,255,255,0));
}
.chevron{opacity:.45;user-select:none;font-size:14px;color:var(--muted);letter-spacing:-1px}
.title-lg{font-weight:600;letter-spacing:.01em;font-size:15px}

/* ─── STEP DOTS ──────────────────────────────────────────────── */
.steps{
  display:flex;gap:10px;justify-content:center;
  padding:14px 0 16px;position:relative;
}
.steps::before{
  content:"";position:absolute;top:50%;left:50%;
  transform:translate(-50%,-50%);
  width:68px;height:2px;
  background:rgba(0,0,0,.08);border-radius:2px;
}
.dot{
  width:8px;height:8px;border-radius:50%;
  background:#D0D3D8;
  transition:all var(--t-mid) var(--ease-spring);
  opacity:.5;position:relative;z-index:1;
}
.dot.active{
  background:var(--accent);
  transform:scale(1.6);
  opacity:1;
  box-shadow:0 0 0 3px rgba(10,132,255,.18);
}
.dot.done{
  background:rgba(10,132,255,.5);
  opacity:.8;
}

/* ─── SCREENS ────────────────────────────────────────────────── */
.card-content{position:relative;min-height:220px;perspective:800px}
.screen{
  position:absolute;inset:0;
  padding:20px 18px 24px;
  display:flex;flex-direction:column;gap:14px;
  align-items:center;justify-content:flex-start;
  opacity:0;transform:translateX(20px) scale(.98);pointer-events:none;
  transition:opacity var(--t-slow) var(--ease-snap),
             transform var(--t-slow) var(--ease-snap);
  will-change:opacity,transform;
}
.screen.active{opacity:1;transform:none;pointer-events:auto}
.screen:not(.active){opacity:0!important;transform:translateX(20px) scale(.98)!important}
.screen.out-left{animation:slideOutL var(--t-mid) var(--ease-snap) forwards}
.screen.out-right{animation:slideOutR var(--t-mid) var(--ease-snap) forwards}
@keyframes slideOutL{from{opacity:1;transform:none}to{opacity:0;transform:translateX(-22px) scale(.98)}}
@keyframes slideOutR{from{opacity:1;transform:none}to{opacity:0;transform:translateX(22px) scale(.98)}}
.flash-once{
  animation:flashBg .8s var(--ease-soft);
  background:radial-gradient(220px 70px at 50% 0%,rgba(52,199,89,.10),transparent 70%),#fff;
}
@keyframes flashBg{
  0%{box-shadow:inset 0 0 0 0 rgba(52,199,89,.0)}
  35%{box-shadow:inset 0 0 0 60px rgba(52,199,89,.10)}
  100%{box-shadow:inset 0 0 0 0 rgba(52,199,89,.0)}
}

/* ─── INPUTS ─────────────────────────────────────────────────── */
.input,.textarea{
  width:100%;max-width:520px;
  padding:13px 16px;
  border-radius:var(--radius-sm);
  border:1px solid rgba(0,0,0,.08);
  background:rgba(250,250,252,.95);
  outline:none;
  font-weight:500;color:var(--text);
  box-shadow:inset 0 1px 3px rgba(0,0,0,.04),0 1px 2px rgba(0,0,0,.02);
  transition:border-color var(--t-fast) var(--ease-soft),
             box-shadow var(--t-fast) var(--ease-soft),
             transform var(--t-fast) var(--ease-soft);
}
.input:hover,.textarea:hover{
  border-color:rgba(0,0,0,.14);
}
.input:focus,.textarea:focus{
  border-color:var(--accent);
  box-shadow:0 0 0 4px rgba(10,132,255,.14),inset 0 1px 3px rgba(0,0,0,.02);
  transform:translateY(-1px);
  background:#fff;
}
.textarea{min-height:88px;max-height:220px;resize:vertical}
.search-input{
  margin:8px 10px;
  width:calc(100% - 20px);
  max-width:none;
  font-size:14px;
  padding:10px 14px;
  background:rgba(245,246,248,.9);
}

/* ─── BUTTONS — CORE ────────────────────────────────────────── */
.btn{
  position:relative;
  display:inline-flex;align-items:center;justify-content:center;gap:7px;
  padding:12px 18px;
  border:1px solid rgba(0,0,0,.07);
  border-radius:var(--radius-sm);
  color:var(--text);
  background:linear-gradient(180deg,#FBFCFD 0%,#F3F4F6 100%);
  box-shadow:var(--shadow-btn);
  font-weight:500;letter-spacing:.01em;font-size:15px;
  overflow:hidden;
  transition:
    transform var(--t-fast) var(--ease-spring),
    box-shadow var(--t-fast) var(--ease-soft),
    background var(--t-fast) var(--ease-soft),
    border-color var(--t-fast) var(--ease-soft),
    filter var(--t-fast) var(--ease-soft);
  will-change:transform,box-shadow;
  cursor:pointer;
}
/* Shine layer */
.btn::before{
  content:"";position:absolute;inset:0;
  background:linear-gradient(180deg,rgba(255,255,255,.55) 0%,rgba(255,255,255,0) 50%);
  border-radius:inherit;pointer-events:none;
}
/* Ripple layer */
.btn::after{
  content:"";position:absolute;
  left:var(--px,50%);top:var(--py,50%);
  width:0;height:0;border-radius:50%;opacity:0;pointer-events:none;
  background:rgba(255,255,255,.55);
  transform:translate(-50%,-50%);
}
.btn:hover{
  transform:translateY(-2px) scale(1.01);
  box-shadow:var(--shadow-btn-hover);
  background:linear-gradient(180deg,#FFFFFF 0%,#F5F6F8 100%);
  border-color:rgba(0,0,0,.10);
}
.btn:active{
  transform:scale(.97) translateY(0);
  box-shadow:0 1px 3px rgba(0,0,0,.06),inset 0 2px 4px rgba(0,0,0,.06);
  transition-duration:80ms;
}
.btn:disabled{opacity:.55;transform:none;pointer-events:none}
.btn.pressed::after{animation:pressPulse .55s var(--ease-snap) forwards}
@keyframes pressPulse{
  0%{opacity:.5;width:0;height:0}
  60%{opacity:.18;width:200%;height:200%}
  100%{opacity:0;width:260%;height:260%}
}

/* Primary */
.btn-primary{
  background:linear-gradient(180deg,#1A8FFF 0%,#0A7BF0 60%,#0070E0 100%);
  color:#fff;border-color:rgba(0,60,140,.18);
  box-shadow:var(--shadow-btn-primary);
}
.btn-primary::before{
  background:linear-gradient(180deg,rgba(255,255,255,.28) 0%,rgba(255,255,255,0) 55%);
}
.btn-primary:hover{
  background:linear-gradient(180deg,#2196FF 0%,#0A84FF 55%,#0078ED 100%);
  box-shadow:var(--shadow-btn-primary-hover);
  transform:translateY(-2px) scale(1.01);
}
.btn-primary:active{
  background:linear-gradient(180deg,#0070E0 0%,#0066CC 100%);
  box-shadow:0 1px 4px rgba(10,132,255,.25),inset 0 2px 4px rgba(0,40,100,.15);
}
.btn-primary::after{background:rgba(255,255,255,.45)}

/* Secondary */
.btn-secondary{
  background:linear-gradient(180deg,#F6F7FA 0%,#ECEEF2 100%);
  border-color:rgba(0,0,0,.08);
}
.btn-secondary:hover{
  background:linear-gradient(180deg,#FAFBFE 0%,#F0F2F6 100%);
}

/* State buttons row */
.row{display:flex;gap:10px;flex-wrap:wrap;justify-content:center;width:100%;max-width:520px}
.row.states{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:10px;width:100%;max-width:520px}
.row.states .btn{
  width:100%;
  font-weight:600;font-size:14px;letter-spacing:.02em;
  min-height:54px;
  border-radius:14px;
  border:1.5px solid rgba(0,0,0,.07);
  flex-direction:column;gap:3px;
}
.row.states .btn:hover{
  transform:translateY(-3px) scale(1.02);
  box-shadow:var(--shadow-float);
}
.row.states .btn.selected{
  border-color:var(--accent);
  background:linear-gradient(180deg,rgba(10,132,255,.12) 0%,rgba(10,132,255,.07) 100%);
  box-shadow:0 0 0 2px rgba(10,132,255,.22),var(--shadow-btn-hover);
  transform:scale(1.03) translateY(-2px);
}
/* Checkmark for selected state */
.row.states .btn.selected::after{
  content:"";
  position:absolute;top:7px;right:9px;
  width:7px;height:7px;border-radius:50%;
  background:var(--accent);
  box-shadow:0 0 0 2px rgba(10,132,255,.25);
  opacity:1;animation:dotPop .3s var(--ease-spring);
}
@keyframes dotPop{
  0%{transform:scale(0) translate(50%,50%);opacity:0}
  70%{transform:scale(1.3) translate(50%,50%)}
  100%{transform:scale(1) translate(50%,50%)}
}
@keyframes levitate{
  0%{transform:scale(1) translateY(0)}
  40%{transform:scale(1.04) translateY(-5px)}
  100%{transform:scale(1.02) translateY(-2px)}
}

/* Action buttons (PDF / Limpiar) */
.action-btn{
  position:relative;overflow:hidden;
  display:inline-flex;align-items:center;justify-content:center;gap:8px;
  padding:12px 20px;
  border-radius:var(--radius-sm);
  border:1px solid rgba(0,0,0,.08);
  background:linear-gradient(180deg,#FBFCFD 0%,#F3F4F6 100%);
  font-weight:600;font-size:14.5px;letter-spacing:.01em;
  color:var(--text);
  box-shadow:var(--shadow-btn);
  transition:
    transform var(--t-fast) var(--ease-spring),
    box-shadow var(--t-fast) var(--ease-soft),
    background var(--t-fast) var(--ease-soft),
    opacity var(--t-fast) var(--ease-soft);
  will-change:transform;
  cursor:pointer;
}
.action-btn::before{
  content:"";position:absolute;inset:0;
  background:linear-gradient(180deg,rgba(255,255,255,.5) 0%,rgba(255,255,255,0) 50%);
  pointer-events:none;border-radius:inherit;
}
/* Shine sweep on hover */
.action-btn::after{
  content:"";position:absolute;
  top:0;left:-55%;width:45%;height:100%;
  background:linear-gradient(90deg,rgba(255,255,255,0),rgba(255,255,255,.4),rgba(255,255,255,0));
  transform:skewX(-18deg);
  transition:left .5s var(--ease-out),opacity .5s var(--ease-out);
  opacity:0;pointer-events:none;
}
.action-btn:hover{
  transform:translateY(-2px) scale(1.01);
  box-shadow:var(--shadow-btn-hover);
  background:linear-gradient(180deg,#FFFFFF 0%,#F5F6F8 100%);
}
.action-btn:hover::after{left:110%;opacity:1}
.action-btn:active{
  transform:scale(.97);
  box-shadow:0 1px 3px rgba(0,0,0,.06),inset 0 1px 3px rgba(0,0,0,.07);
  opacity:.9;
  transition-duration:70ms;
}
.action-btn.danger{color:#C0000A}
.action-btn.danger:hover{
  background:linear-gradient(180deg,#FFF5F5 0%,#FFECEC 100%);
  border-color:rgba(255,59,48,.15);
}

/* Record action buttons */
.record .actions .action-btn{
  padding:7px 13px;font-size:13px;border-radius:10px;
  font-weight:600;min-height:auto;
}

/* Segment (filter tabs) */
.compact-header{
  position:sticky;top:12px;z-index:5;
  padding:10px 10px 0;
  background:linear-gradient(180deg,rgba(252,252,254,1),rgba(252,252,254,.0));
  border-bottom:1px solid var(--line);
  border-top-left-radius:var(--radius);border-top-right-radius:var(--radius);
}
.segment{
  display:flex;flex-wrap:wrap;gap:5px;
  padding:4px;justify-content:center;
  border:0;background:transparent;
}
.segment button{
  position:relative;
  display:inline-flex;align-items:center;gap:6px;
  padding:6px 11px;border-radius:999px;
  border:1px solid rgba(0,0,0,.05);
  background:rgba(255,255,255,.8);
  font-size:13px;font-weight:500;color:var(--muted);
  box-shadow:0 1px 3px rgba(0,0,0,.05),inset 0 1px 0 rgba(255,255,255,.8);
  min-height:0;
  transition:
    transform var(--t-fast) var(--ease-spring),
    background var(--t-fast) var(--ease-soft),
    box-shadow var(--t-fast) var(--ease-soft),
    color var(--t-fast) var(--ease-soft),
    border-color var(--t-fast) var(--ease-soft);
}
.segment button::before{
  content:"";width:7px;height:7px;border-radius:50%;
  background:#CBD0D5;flex-shrink:0;
  transition:background var(--t-fast) var(--ease-soft),transform var(--t-fast) var(--ease-spring);
}
.segment button[data-tab="TODAS"]::before{background:linear-gradient(135deg,#0A84FF,#00B487)}
.segment button[data-tab="CARGADA"]::before{background:#0A8369}
.segment button[data-tab="VACÍA"]::before{background:#1564C0}
.segment button[data-tab="AVERIADA"]::before{background:#8F6200}
.segment button:hover{
  transform:translateY(-1px) scale(1.02);
  background:rgba(255,255,255,.95);
  box-shadow:0 2px 8px rgba(0,0,0,.08),inset 0 1px 0 rgba(255,255,255,.9);
  color:var(--text);
}
.segment button:hover::before{transform:scale(1.15)}
.segment button:active{transform:scale(.97);transition-duration:60ms}
.segment button.active{
  background:rgba(10,132,255,.10);
  border-color:rgba(10,132,255,.28);
  color:var(--text);font-weight:600;
  box-shadow:0 0 0 1px rgba(10,132,255,.16),0 2px 8px rgba(10,132,255,.10);
}

/* Badges in segment */
.segment .badge{
  margin-left:1px;
  min-width:17px;height:17px;
  padding:0 5px;border-radius:999px;
  font-size:11px;font-weight:700;line-height:17px;
  background:rgba(0,0,0,.07);color:var(--accent);
  display:inline-block;text-align:center;
  transition:all var(--t-fast) var(--ease-spring);
}
.segment button.active .badge{
  background:rgba(10,132,255,.18);color:var(--accent-deep);
}
.badge-pop{animation:badgePop .4s var(--ease-spring)}
@keyframes badgePop{
  0%{transform:scale(.5);opacity:0}
  65%{transform:scale(1.15)}
  100%{transform:scale(1);opacity:1}
}

/* Call button */
.segment button[data-tab="CALL"]{
  border-color:rgba(0,0,0,.06);
}
.call-alert{
  border-color:rgba(255,59,48,.3)!important;
  background:rgba(255,59,48,.07)!important;
  color:#C0000A!important;
  animation:callPulse 2s ease infinite;
}
@keyframes callPulse{
  0%,100%{box-shadow:0 0 0 0 rgba(255,59,48,.0)}
  50%{box-shadow:0 0 0 4px rgba(255,59,48,.15)}
}
.notif-badge{
  display:none;
  background:var(--danger);color:#fff;
  padding:0 5px;border-radius:999px;
  font-size:10px;font-weight:700;line-height:16px;
  margin-left:3px;
  animation:badgePop .35s var(--ease-spring);
}

/* ─── PANEL ──────────────────────────────────────────────────── */
.panel{
  background:#fff;
  border:1px solid rgba(0,0,0,.06);
  border-radius:var(--radius);
  box-shadow:var(--shadow-card);
  margin:18px 0;
  padding:18px;
  transition:box-shadow var(--t-mid) var(--ease-soft);
}
.panel.actions{
  background:transparent!important;
  box-shadow:none!important;
  border:none!important;
  display:flex;gap:12px;justify-content:center;flex-wrap:wrap;
  padding:4px 0!important;
}

/* ─── PILLS (summary) ────────────────────────────────────────── */
.pills{
  display:grid;
  grid-template-columns:repeat(auto-fit,minmax(200px,1fr));
  gap:12px;
}
.pill{
  position:relative;overflow:hidden;
  border:1px solid rgba(0,0,0,.06);
  border-radius:12px;padding:13px 16px;
  background:#fff;
  box-shadow:0 1px 4px rgba(0,0,0,.04),0 4px 14px rgba(0,0,0,.04);
  transition:
    transform var(--t-mid) var(--ease-spring),
    box-shadow var(--t-mid) var(--ease-soft);
}
.pill::before{
  content:"";position:absolute;inset:0;width:var(--fill,0%);
  background:linear-gradient(90deg,rgba(10,132,255,.12),rgba(10,132,255,.22));
  transition:width .55s var(--ease-out);
  pointer-events:none;
}
.pill:hover{transform:translateY(-2px);box-shadow:var(--shadow-float)}
.pill.update::after{
  content:"";position:absolute;top:0;bottom:0;width:30%;left:-35%;
  background:linear-gradient(90deg,rgba(255,255,255,0),rgba(255,255,255,.7),rgba(255,255,255,0));
  filter:blur(1px);
  animation:pillShine 1s var(--ease-soft);
}
@keyframes pillShine{0%{left:-35%}100%{left:115%}}
.pill-inner{position:relative;display:flex;align-items:center;justify-content:space-between;gap:10px;z-index:1}
.pill .label{font-weight:500;letter-spacing:.01em;font-size:14px;color:var(--muted)}
.pill .val{
  font-weight:700;min-width:2.5ch;text-align:right;
  color:var(--accent);font-variant-numeric:tabular-nums;font-size:20px;
  letter-spacing:-.02em;
  transition:transform var(--t-fast) var(--ease-spring),color var(--t-fast) ease;
}
.pill-val-update{animation:pulseVal .3s var(--ease-spring)}
@keyframes pulseVal{0%{transform:scale(1)}45%{transform:scale(1.12)}100%{transform:scale(1)}}

/* ─── COMPACT / RECORDS ──────────────────────────────────────── */
.compact{
  background:#fff;
  border:1px solid rgba(0,0,0,.06);
  border-radius:var(--radius);
  box-shadow:var(--shadow-card);
}
#recordsContainer{
  display:grid;
  grid-template-columns:1fr;
  gap:8px;
  padding:10px;
}
@media(min-width:700px){
  #recordsContainer{grid-template-columns:repeat(2,minmax(0,1fr))}
}
@media(min-width:1100px){
  #recordsContainer{grid-template-columns:repeat(3,minmax(0,1fr))}
}
.record{
  position:relative;
  background:#fff;
  border:1px solid rgba(0,0,0,.06);
  border-radius:12px;
  padding:11px 13px 11px 18px;
  display:flex;flex-direction:column;gap:0;
  min-width:0;width:100%;
  box-shadow:0 1px 3px rgba(0,0,0,.03),0 3px 10px rgba(0,0,0,.04);
  overflow:hidden;
  animation:recordEntry .35s var(--ease-out) both;
  transition:
    transform var(--t-mid) var(--ease-spring),
    box-shadow var(--t-mid) var(--ease-soft),
    background var(--t-mid) var(--ease-soft);
  cursor:pointer;
}
@keyframes recordEntry{
  0%{opacity:0;transform:translateY(8px)}
  100%{opacity:1;transform:none}
}
.record:hover{
  transform:translateY(-1px);
  box-shadow:0 4px 16px rgba(0,0,0,.08);
}
/* State accent bar */
.record::before{
  content:"";
  position:absolute;left:0;top:0;bottom:0;width:4px;
  border-radius:4px 0 0 4px;
  background:rgba(0,0,0,.08);
  transition:background var(--t-fast) ease;
}
.record[data-estado="CARGADA"]::before{background:rgba(0,180,135,.55)}
.record[data-estado="VACÍA"]::before{background:rgba(33,131,255,.55)}
.record[data-estado="AVERIADA"]::before{background:rgba(241,184,58,.65)}
.record.expanded{
  box-shadow:0 8px 28px rgba(0,0,0,.10);
  background:#fafbfd;
}
/* Highlight duplicate */
.highlight-dup{
  animation:dupFlash .8s var(--ease-soft);
  outline:2px solid rgba(255,159,10,.6)!important;
}
@keyframes dupFlash{0%{background:#fff}40%{background:rgba(255,159,10,.12)}100%{background:#fff}}

.rowline{display:flex;align-items:center;justify-content:space-between;gap:8px;padding:1px 0}
.rowline .mat{font-weight:600;font-size:15px;max-width:48%;white-space:nowrap;overflow:hidden;text-overflow:ellipsis;color:var(--text)}
.rowline .ts{opacity:.55;font-size:12px;font-variant-numeric:tabular-nums;white-space:nowrap}
.rowline .est{
  font-size:11.5px;font-weight:700;letter-spacing:.04em;
  padding:2px 8px;border-radius:999px;
  opacity:.9;white-space:nowrap;
}
/* State badge colors */
.record[data-estado="CARGADA"] .est{background:rgba(0,180,135,.12);color:#0A8369}
.record[data-estado="VACÍA"] .est{background:rgba(33,131,255,.12);color:#1564C0}
.record[data-estado="AVERIADA"] .est{background:rgba(241,184,58,.15);color:#8F6200}

.record .content{
  white-space:pre-wrap;overflow-wrap:anywhere;word-break:break-word;
  font-size:13.5px;color:var(--muted);line-height:1.45;
  margin-top:7px;margin-bottom:2px;
  display:none;
}
.record.expanded .content{display:block;animation:fadeContent .2s var(--ease-soft)}
@keyframes fadeContent{0%{opacity:0;transform:translateY(4px)}100%{opacity:1;transform:none}}
.record .actions{display:none;justify-content:flex-end;gap:7px;margin-top:8px;flex-wrap:wrap}
.record.expanded .actions{display:flex}

/* ─── META ───────────────────────────────────────────────────── */
.meta{display:flex;flex-wrap:wrap;align-items:center;justify-content:center;gap:5px 10px;max-width:520px}
.meta .item{color:var(--muted);font-weight:500;white-space:nowrap;font-size:14px}
.meta strong{color:var(--text);font-weight:600}

/* ─── MODAL ──────────────────────────────────────────────────── */
.modal{
  position:fixed;inset:0;display:none;
  align-items:center;justify-content:center;z-index:30;
  background:rgba(0,0,0,.24);
  backdrop-filter:blur(4px);
  -webkit-backdrop-filter:blur(4px);
}
.modal.open{display:flex}
.modal-card{
  width:min(96vw,540px);background:#fff;
  border:1px solid rgba(0,0,0,.06);
  border-radius:22px;
  box-shadow:0 28px 80px rgba(0,0,0,.28),inset 0 1px 0 rgba(255,255,255,.8);
  padding:20px;display:flex;flex-direction:column;gap:12px;
  animation:modalIn .35s var(--ease-spring) both;
}
@keyframes modalIn{
  0%{transform:scale(.92) translateY(16px);opacity:0}
  100%{transform:scale(1) translateY(0);opacity:1}
}
.modal-title{font-weight:600;font-size:18px;letter-spacing:.01em}
.modal-row{display:grid;grid-template-columns:1fr 1fr;gap:10px}
.modal-actions{display:flex;gap:10px;justify-content:flex-end}
select{
  padding:13px 16px;border-radius:var(--radius-sm);
  border:1px solid rgba(0,0,0,.08);background:#fafafa;
  transition:border-color var(--t-fast) ease,box-shadow var(--t-fast) ease;
}
select:focus{
  outline:none;border-color:var(--accent);
  box-shadow:0 0 0 4px rgba(10,132,255,.14);
}
@media(max-width:640px){
  .row .btn{flex:1 1 100%}
  .modal-row{grid-template-columns:1fr}
}

/* ─── TOAST / DYNAMIC ISLAND ─────────────────────────────────── */
.toast{
  position:fixed;left:50%;top:16px;transform:translateX(-50%) translateY(-16px);
  background:rgba(52,199,89,.96);color:#fff;
  padding:10px 16px;border-radius:12px;
  box-shadow:0 10px 28px rgba(0,0,0,.18);opacity:0;z-index:50;
  border:1px solid rgba(255,255,255,.55);
  font-weight:600;font-size:14px;
}
.toast.show{animation:toastIn 1.8s var(--ease-soft)}
@keyframes toastIn{
  0%{opacity:0;transform:translateX(-50%) translateY(-16px)}
  12%{opacity:1;transform:translateX(-50%) translateY(0)}
  88%{opacity:1}
  100%{opacity:0;transform:translateX(-50%) translateY(-16px)}
}
#dynamicIsland{
  position:fixed;top:12px;left:50%;
  transform:translateX(-50%) scale(.96);
  opacity:0;padding:10px 22px;
  background:rgba(0,0,0,.78);
  backdrop-filter:blur(22px);-webkit-backdrop-filter:blur(22px);
  border-radius:18px;border:1px solid rgba(255,255,255,.22);
  box-shadow:0 22px 48px rgba(0,0,0,.55);
  font-weight:600;font-size:14px;color:#fff;letter-spacing:.01em;
  z-index:9999;isolation:isolate;overflow:hidden;
  min-width:130px;text-align:center;
  transition:opacity .32s var(--ease-snap),transform .32s var(--ease-snap);
}
#dynamicIsland::after{
  content:"";position:absolute;left:10px;right:10px;bottom:7px;height:3px;
  background:rgba(255,255,255,.18);border-radius:3px;overflow:hidden;
}
#dynamicIsland .bar{
  position:absolute;left:10px;bottom:7px;height:3px;width:0%;
  background:rgba(255,255,255,.75);border-radius:3px;transition:width .2s ease;
}
#dynamicIsland.di-show{
  opacity:1;transform:translateX(-50%) scale(1);
  animation:islandPop .38s var(--ease-spring) both;
}
#dynamicIsland.di-hide{
  animation:islandShrink .28s ease-out forwards;
}
#dynamicIsland.di-hidden{opacity:0;transform:translateX(-50%) scale(.88)}
@keyframes islandPop{
  0%{transform:translateX(-50%) scale(.88);opacity:0}
  55%{transform:translateX(-50%) scale(1.05);opacity:1}
  100%{transform:translateX(-50%) scale(1);opacity:1}
}
@keyframes islandShrink{
  0%{transform:translateX(-50%) scale(1);opacity:1}
  100%{transform:translateX(-50%) scale(.88);opacity:0}
}

/* ─── MENU ───────────────────────────────────────────────────── */
.menu-trigger{
  position:relative;
  border:1px solid rgba(255,255,255,.65);
  background:linear-gradient(150deg,rgba(255,255,255,.9),rgba(240,240,245,.96));
  border-radius:12px;padding:8px 12px;font-weight:600;
  box-shadow:var(--shadow-btn);
}
.menu-trigger:hover{transform:translateY(-1px);box-shadow:var(--shadow-btn-hover)}
.menu-trigger:active{transform:scale(.97)}
.menu-apple{
  position:absolute;top:calc(100% + 8px);right:0;min-width:200px;
  background:rgba(255,255,255,.92);
  backdrop-filter:blur(18px);-webkit-backdrop-filter:blur(18px);
  border:1px solid rgba(0,0,0,.08);border-radius:16px;padding:6px;
  box-shadow:0 20px 40px rgba(0,0,0,.14),inset 0 1px 0 rgba(255,255,255,.8);
  transform-origin:top right;transform:scale(.95) translateY(-6px);
  opacity:0;pointer-events:none;
  transition:transform var(--t-mid) var(--ease-spring),
             opacity var(--t-mid) var(--ease-soft);
  z-index:5000;
}
.menu-apple.show{transform:scale(1) translateY(0);opacity:1;pointer-events:auto}
.menu-apple .item{
  display:flex;align-items:center;justify-content:space-between;
  padding:10px 12px;border-radius:10px;font-weight:500;color:var(--text);
  border:1px solid transparent;font-size:14px;
  transition:background var(--t-fast) ease,border-color var(--t-fast) ease;
}
.menu-apple .item:hover{background:rgba(10,132,255,.07);border-color:rgba(10,132,255,.12)}
.menu-apple .divider{height:1px;margin:5px 4px;background:var(--line);border-radius:1px}

/* ─── CLEAR EFFECT ───────────────────────────────────────────── */
#clearEffect{position:fixed;inset:0;pointer-events:none;display:none;z-index:3000}
.particle{
  position:absolute;width:7px;height:7px;border-radius:50%;
  background:rgba(255,255,255,.9);
  box-shadow:0 0 12px rgba(255,255,255,.85);
  animation:particleOut .58s ease-out forwards;
}
@keyframes particleOut{to{transform:translate(var(--dx),var(--dy)) scale(0);opacity:0}}
.flash{
  position:absolute;inset:0;
  background:radial-gradient(circle at center,rgba(255,255,255,.88),transparent 68%);
  animation:flashOut .5s ease-out forwards;
}
@keyframes flashOut{from{opacity:1}to{opacity:0}}

/* Clear hold bar */
#clearHoldBar{
  position:absolute;left:0;bottom:0;height:3px;width:0%;
  background:rgba(255,59,48,.9);border-radius:2px;
}
.vision-bubble{
  position:absolute;top:-55px;left:50%;
  transform:translateX(-50%) scale(.75);
  padding:9px 16px;
  background:rgba(255,255,255,.75);
  backdrop-filter:blur(18px);-webkit-backdrop-filter:blur(18px);
  border-radius:16px;font-size:13px;color:#000;
  opacity:0;pointer-events:none;
  box-shadow:0 8px 22px rgba(0,0,0,.16);
  transition:transform .3s var(--ease-soft),opacity .22s ease-out;
}
.vision-bubble.show{opacity:1;transform:translateX(-50%) scale(1)}
#clearAll{position:relative;overflow:visible}

/* ─── ENTRANCE ANIMATIONS ────────────────────────────────────── */
.card,.panel,.pill,.compact{
  opacity:0;transform:translateY(20px) scale(.98);
  animation:spatialIn .65s var(--ease-out) forwards;
}
.card:nth-child(1){animation-delay:.04s}
.card:nth-child(2){animation-delay:.08s}
.panel{animation-delay:.06s}
.compact{animation-delay:.10s}
@keyframes spatialIn{
  to{opacity:1;transform:translateY(0) scale(1)}
}

/* ─── DYNAMIC LIGHT ──────────────────────────────────────────── */
.dynamic-light{position:relative;overflow:hidden}
.dynamic-light::after{
  content:"";position:absolute;inset:0;
  background:radial-gradient(circle at var(--mX,50%) var(--mY,50%),rgba(255,255,255,.22),transparent 58%);
  pointer-events:none;opacity:0;
  transition:opacity .3s ease;
}
.dynamic-light:hover::after{opacity:.7}

/* ─── FLOW CARD WIDTH ────────────────────────────────────────── */
section.card#flowCard{
  width:100%!important;max-width:720px!important;
  margin-left:auto!important;margin-right:auto!important;
}
@media(max-width:600px){
  section.card#flowCard{max-width:100%!important;padding:0!important;border-radius:16px!important}
  section.card#flowCard .screen{padding:16px 12px 22px!important}
  .pills{grid-template-columns:1fr!important}
  .segment button{flex:1 1 auto;justify-content:flex-start}
}
@media(min-width:600px) and (max-width:900px){
  section.card#flowCard{max-width:600px!important}
}

/* ─── SCROLLED STATE ─────────────────────────────────────────── */
body.scrolled .card,body.scrolled .panel,body.scrolled .compact{
  backdrop-filter:blur(24px) saturate(180%);
  -webkit-backdrop-filter:blur(24px) saturate(180%);
}

<script>
/* ─── CORE ─────────────────────────────────────────────────── */
const $ = id => document.getElementById(id);
const fmtHour = () => new Date().toLocaleTimeString('es-ES',{hour:'2-digit',minute:'2-digit',second:'2-digit'});
let plataformas = [];
let currentMatricula = '', currentEstado = '';
let currentTab = 'TODAS', editingId = null, searchQuery = '';
const STORAGE_KEY = 'plataformas-global';

function loadData(){ try{ const r=localStorage.getItem(STORAGE_KEY); plataformas=r?JSON.parse(r):[]; }catch(e){ plataformas=[]; } }
function saveData(){ try{ localStorage.setItem(STORAGE_KEY, JSON.stringify(plataformas)); }catch(e){} }

function keepCardInView(){
  const card=$('flowCard'); if(!card) return;
  const r=card.getBoundingClientRect();
  if(r.top<12||r.bottom>(window.innerHeight-12)){
    card.scrollIntoView({behavior:'smooth',block:'start'});
  }
}

/* ─── RIPPLE EFFECT ──────────────────────────────────────── */
function attachPressedEffect(el){
  if(!el) return;
  el.addEventListener('pointerdown', ev=>{
    const r=el.getBoundingClientRect();
    el.style.setProperty('--px', Math.round(ev.clientX-r.left)+'px');
    el.style.setProperty('--py', Math.round(ev.clientY-r.top)+'px');
    el.classList.add('pressed');
  });
  ['pointerup','pointerleave','pointercancel'].forEach(e=>
    el.addEventListener(e,()=>setTimeout(()=>el.classList.remove('pressed'),200))
  );
}

/* ─── DYNAMIC ISLAND ─────────────────────────────────────── */
function showIsland(text='Acción completada', duration=1600){
  const island=$('dynamicIsland'), textEl=$('diText'), bar=$('diBar');
  if(!island||!textEl) return;
  textEl.textContent = text;
  island.classList.remove('di-hide','di-hidden');
  island.classList.add('di-show');
  if(bar){ bar.style.width='0%'; setTimeout(()=>bar.style.width='100%',20); }
  if(window.__islandTimer) clearTimeout(window.__islandTimer);
  window.__islandTimer = setTimeout(()=>{
    island.classList.remove('di-show');
    island.classList.add('di-hide');
    setTimeout(()=>{ island.classList.remove('di-hide'); island.classList.add('di-hidden'); },280);
  }, duration);
}
function toast(msg='Registro guardado'){ showIsland(msg, 1800); }

/* ─── ANIMATED NUMBERS ───────────────────────────────────── */
function animateNumber(el, target){
  if(!el) return;
  const start=Number(el.textContent)||0, diff=target-start;
  if(!diff){ el.textContent=target; return; }
  const dur=380, startT=performance.now();
  function step(t){
    const p=Math.min(1,(t-startT)/dur);
    const ease=1-Math.pow(1-p,3);
    el.textContent=Math.round(start+diff*ease);
    if(p<1) requestAnimationFrame(step);
    else el.textContent=target;
  }
  requestAnimationFrame(step);
  el.classList.add('pill-val-update');
  setTimeout(()=>el.classList.remove('pill-val-update'),300);
}

function setFill(pillId, pct){
  const el=$(pillId); if(!el) return;
  requestAnimationFrame(()=>{ el.style.setProperty('--fill', Math.max(0,Math.min(100,pct)).toFixed(0)+'%'); });
  el.classList.add('update');
  setTimeout(()=>el.classList.remove('update'),1100);
}

/* ─── RENDER ─────────────────────────────────────────────── */
function renderCompactList(){
  const box=$('recordsContainer'); if(!box) return;
  const base = currentTab==='TODAS'
    ? plataformas.slice().reverse()
    : plataformas.filter(p=>p.estado===currentTab).slice().reverse();
  const q=(searchQuery||'').trim().toLowerCase();
  const data = q
    ? base.filter(it=>(it.matricula||'').toLowerCase().includes(q)||((it.contenido||'').toLowerCase().includes(q)))
    : base;
  box.innerHTML = data.map(it=>`
    <div class="record" data-id="${it.id}" data-estado="${it.estado}">
      <div class="rowline">
        <div class="mat">${it.matricula}</div>
        <div style="display:flex;gap:6px;align-items:center;">
          <div class="ts">${it.timestamp||''}</div>
          <div class="est">${it.estado}</div>
        </div>
      </div>
      <div class="content" style="display:none">${(it.contenido||'').replace(/</g,'&lt;')}</div>
      <div class="actions" style="display:none">
        <button class="action-btn qa" data-action="edit">Editar</button>
        <button class="action-btn danger qa" data-action="delete">Eliminar</button>
      </div>
    </div>
  `).join('')||'<div style="opacity:.5;text-align:center;padding:24px;font-size:14px;color:var(--muted)">Sin registros</div>';
}

function updateAll(){
  const cargadas=plataformas.filter(p=>p.estado==='CARGADA');
  const vacias=plataformas.filter(p=>p.estado==='VACÍA');
  const averiadas=plataformas.filter(p=>p.estado==='AVERIADA');
  const total=plataformas.length||1;
  animateNumber($('cargadasCount'), cargadas.length);
  animateNumber($('vaciasCount'), vacias.length);
  animateNumber($('averiadasCount'), averiadas.length);
  animateNumber($('totalCount'), plataformas.length);
  setFill('pillCargadas', cargadas.length/total*100);
  setFill('pillVacias', vacias.length/total*100);
  setFill('pillAveriadas', averiadas.length/total*100);
  setFill('pillTotal', 100);
  // Update badges
  ['bAll','bCargadas','bVacias','bAveriadas'].forEach((id,i)=>{
    const el=$(id); if(!el) return;
    const counts=[plataformas.length,cargadas.length,vacias.length,averiadas.length];
    const prev=el.textContent; el.textContent=counts[i];
    if(prev!==String(counts[i])){ el.classList.add('badge-pop'); setTimeout(()=>el.classList.remove('badge-pop'),400); }
  });
  // Call alert badge
  const avg=averiadas.length;
  const badge=$('callBadge'), callBtn=document.querySelector('button[data-tab="CALL"]');
  if(avg>0){
    if(badge) badge.style.display='inline-block';
    if(callBtn) callBtn.classList.add('call-alert');
  } else {
    if(badge) badge.style.display='none';
    if(callBtn) callBtn.classList.remove('call-alert');
  }
  renderCompactList();
}

/* ─── MODAL ──────────────────────────────────────────────── */
function openEditModal(id){
  const it=plataformas.find(p=>p.id===id); if(!it) return;
  editingId=id;
  $('editMatricula').value=it.matricula;
  $('editEstado').value=it.estado;
  $('editContenido').value=it.contenido||'';
  const m=$('editModal');
  m.classList.add('open'); m.setAttribute('aria-hidden','false');
  setTimeout(()=>m.querySelector('input,textarea,select')?.focus(),120);
}
function closeEditModal(){
  const m=$('editModal');
  m.classList.remove('open'); m.setAttribute('aria-hidden','true');
  editingId=null;
}
function saveEdit(){
  if(editingId==null) return;
  const idx=plataformas.findIndex(p=>p.id===editingId); if(idx<0) return;
  const m=$('editMatricula').value.trim().toUpperCase();
  if(!m){ alert('La matrícula no puede estar vacía'); return; }
  plataformas[idx].matricula=m;
  plataformas[idx].estado=$('editEstado').value;
  plataformas[idx].contenido=$('editContenido').value.trim();
  saveData(); updateAll(); closeEditModal(); toast('Registro actualizado');
}
function deleteRecord(id){
  if(!plataformas.find(p=>p.id===id)) return;
  if(!confirm('¿Eliminar este registro?')) return;
  plataformas=plataformas.filter(p=>p.id!==id); saveData(); updateAll(); toast('Registro eliminado');
}

/* ─── STEP FLOW ──────────────────────────────────────────── */
let step=1;
function showStep(next, dir='forward'){
  const cur=$('s'+step), nxt=$('s'+next); if(!nxt||cur===nxt) return;
  cur.classList.remove('active');
  cur.classList.add(dir==='forward'?'out-left':'out-right');
  setTimeout(()=>cur.classList.remove('out-left','out-right'),360);
  nxt.classList.add('active');
  ['d1','d2','d3'].forEach((id,i)=>{
    const d=$(id); if(!d) return;
    d.classList.toggle('active',i+1===next);
    d.classList.toggle('done',i+1<next);
  });
  $('flowTitle').textContent=next===1?'Matrícula':next===2?'Estado':'Contenido';
  step=next;
  requestAnimationFrame(()=>{ try{ nxt.focus({preventScroll:true}); }catch(e){} keepCardInView(); });
}
function nextFromS1(){
  const m=$('matriculaInput').value.trim().toUpperCase();
  if(!m){ alert('Por favor, introduce una matrícula válida'); keepCardInView(); return; }
  currentMatricula=m;
  $('matriculaDisplay').textContent=m;
  $('matriculaDisplay2').textContent=m;
  showStep(2,'forward');
}
function chooseEstado(estado){
  currentEstado=estado;
  $('estadoDisplay').textContent=estado;
  // Highlight selected btn
  ['btnCargada','btnVacia','btnAveriada'].forEach(id=>{
    const b=$(id); if(b) b.classList.remove('selected');
  });
  const map={CARGADA:'btnCargada',VACÍA:'btnVacia',AVERIADA:'btnAveriada'};
  const sel=$(map[estado]); if(sel) sel.classList.add('selected');

  if(estado==='VACÍA'){
    if(!currentMatricula){ alert('Introduce primero una matrícula válida'); showStep(1,'back'); return; }
    const dup=plataformas.some(p=>p.matricula===currentMatricula&&p.estado==='VACÍA');
    if(dup){
      toast('Esta matrícula ya fue registrada como VACÍA');
      try{
        const last=plataformas.filter(p=>p.matricula===currentMatricula&&p.estado==='VACÍA').slice(-1)[0];
        if(last){ updateAll(); requestAnimationFrame(()=>{
          const rec=document.querySelector(`.record[data-id="${last.id}"]`);
          if(rec){ rec.classList.add('highlight-dup'); try{ rec.scrollIntoView({behavior:'smooth',block:'center'}); }catch(e){} setTimeout(()=>rec.classList.remove('highlight-dup'),1200); }
        }); }
      }catch(e){}
      return;
    }
    plataformas.push({id:Date.now(),matricula:currentMatricula,estado,contenido:'',timestamp:fmtHour()});
    saveData(); updateAll(); flashSuccess(); resetFlow(); keepCardInView();
  } else {
    showStep(3,'forward');
  }
}
function registrar(){
  const contenido=$('contenidoInput').value.trim();
  if(!contenido){ alert('Describe el contenido o el problema'); keepCardInView(); return; }
  plataformas.push({id:Date.now(),matricula:currentMatricula,estado:currentEstado,contenido,timestamp:fmtHour()});
  saveData(); updateAll();
  const btn=$('btnRegistrar'), prev=btn.textContent;
  btn.disabled=true; btn.textContent='Registrando…';
  setTimeout(()=>{
    btn.textContent='Guardado';
    setTimeout(()=>{ btn.disabled=false; btn.textContent=prev; flashSuccess(); resetFlow(); keepCardInView(); },600);
  },360);
}
function resetFlow(){
  $('matriculaInput').value='';
  $('contenidoInput').value='';
  currentMatricula=''; currentEstado='';
  try{ localStorage.removeItem('draft'); }catch(e){}
  // Clear state btn selections
  ['btnCargada','btnVacia','btnAveriada'].forEach(id=>{ const b=$(id); if(b) b.classList.remove('selected'); });
  showStep(1,'back');
}
function flashSuccess(){
  const active=document.querySelector('.screen.active');
  if(active){ active.classList.remove('flash-once'); void active.offsetWidth; active.classList.add('flash-once'); }
  toast('Registro guardado');
}

/* ─── CLEAR HOLD ─────────────────────────────────────────── */
(function(){
  const clearBtn=$('clearAll'); if(!clearBtn) return;
  let clearTimer=null, progressBar=null;
  function ensureBar(){
    if(progressBar) return progressBar;
    progressBar=document.createElement('div');
    progressBar.id='clearHoldBar';
    Object.assign(progressBar.style,{position:'absolute',left:'0',bottom:'0',height:'3px',width:'0%',background:'rgba(255,59,48,.95)',borderRadius:'2px',transition:'width .08s linear'});
    clearBtn.style.position='relative'; clearBtn.appendChild(progressBar);
    return progressBar;
  }
  function startHold(){
    if(!plataformas.length){ showIsland('No hay registros para limpiar',1200); return; }
    const bar=ensureBar(); bar.style.width='0%';
    let start=performance.now();
    clearTimer=setInterval(()=>{
      const p=Math.min(1,(performance.now()-start)/1400);
      bar.style.width=Math.round(p*100)+'%';
      if(p>=1){ clearInterval(clearTimer); clearTimer=null; plataformas=[]; saveData(); updateAll(); bar.style.width='0%'; showIsland('Registros eliminados',1400); triggerClearEffect(); }
    },80);
  }
  function cancelHold(){
    if(clearTimer){ clearInterval(clearTimer); clearTimer=null; const b=$('clearHoldBar'); if(b) b.style.width='0%'; }
  }
  clearBtn.addEventListener('pointerdown',e=>{ e.preventDefault(); startHold(); });
  ['pointerup','pointercancel','pointerleave'].forEach(ev=>clearBtn.addEventListener(ev,cancelHold));
})();

/* ─── CLEAR EFFECT ───────────────────────────────────────── */
function triggerClearEffect(){
  const effect=$('clearEffect'); if(!effect) return;
  effect.innerHTML='';
  const w=window.innerWidth, h=window.innerHeight;
  const flash=document.createElement('div'); flash.className='flash'; effect.appendChild(flash);
  for(let i=0;i<55;i++){
    const p=document.createElement('div'); p.className='particle';
    p.style.left=(w/2)+'px'; p.style.top=(h/2)+'px';
    const a=Math.random()*2*Math.PI, d=180+Math.random()*200;
    p.style.setProperty('--dx', Math.cos(a)*d+'px');
    p.style.setProperty('--dy', Math.sin(a)*d+'px');
    effect.appendChild(p);
  }
  effect.style.display='block';
  setTimeout(()=>effect.style.display='none',650);
}

/* ─── CLICK DELEGATE ─────────────────────────────────────── */
document.addEventListener('click', e=>{
  const qaBtn=e.target.closest('.qa');
  if(qaBtn){
    const rec=e.target.closest('.record'); if(!rec) return;
    const id=Number(rec.getAttribute('data-id')), act=qaBtn.getAttribute('data-action');
    if(act==='edit'){ openEditModal(id); return; }
    if(act==='delete'){ deleteRecord(id); return; }
    return;
  }
  const row=e.target.closest('.record');
  if(row&&!e.target.closest('.qa')&&!e.target.closest('.action-btn')){
    const content=row.querySelector('.content'), actions=row.querySelector('.actions');
    const expanded=row.classList.toggle('expanded');
    if(content) content.style.display=expanded?'block':'none';
    if(actions) actions.style.display=expanded?'flex':'none';
  }
});

/* ─── PDF GENERATION ─────────────────────────────────────── */
function generatePDF(){
  const registrador=(prompt('Nombre de quien realizó el registro:','')||'').trim();
  if(!registrador) return;
  const {jsPDF}=window.jspdf||{};
  if(!jsPDF){ alert('No se pudo cargar jsPDF. Revisa tu conexión.'); return; }
  const doc=new jsPDF({unit:'mm',format:'a4'});

  // ── Palette ──────────────────────────────────────────────
  const C_TEXT   = [17,20,24];
  const C_MUTED  = [110,115,122];
  const C_LINE   = [225,225,230];
  const C_WHITE  = [255,255,255];
  const C_BGSOFT = [248,249,251];
  const C_ACCENT = [10,132,255];
  // State badge fills
  const C_LOADED_BG  = [230,248,242]; const C_LOADED_TEXT  = [10,131,105];
  const C_EMPTY_BG   = [228,240,255]; const C_EMPTY_TEXT   = [21,100,192];
  const C_BROKEN_BG  = [255,246,228]; const C_BROKEN_TEXT  = [160,100,10];

  const cargadas  = plataformas.filter(p=>p.estado==='CARGADA');
  const vacias    = plataformas.filter(p=>p.estado==='VACÍA');
  const averiadas = plataformas.filter(p=>p.estado==='AVERIADA');

  // ── HEADER PANEL ─────────────────────────────────────────
  // Outer card
  doc.setFillColor(...C_WHITE);
  doc.setDrawColor(...C_LINE);
  doc.setLineWidth(0.4);
  doc.roundedRect(10,8,190,40,5,5,'FD');
  // Subtle top accent strip
  doc.setFillColor(...C_ACCENT);
  doc.roundedRect(10,8,190,1.5,1.5,1.5,'F');

  // Registrador block — left side
  doc.setFillColor(240,244,255);
  doc.roundedRect(14,13,52,14,3,3,'F');
  doc.setFont('helvetica','bold');
  doc.setFontSize(6);
  doc.setTextColor(100,120,160);
  doc.text('REGISTRADO POR', 17, 18.5);
  doc.setFontSize(9.5);
  doc.setTextColor(...C_TEXT);
  doc.text(registrador.toUpperCase(), 17, 24);

  // XPO LOGISTICS — centered
  doc.setFont('helvetica','bold');
  doc.setFontSize(20);
  const full='XPO LOGISTICS', xpoPart='XPO ';
  const startX=105-(doc.getTextWidth(full)/2);
  doc.setTextColor(229,57,53); doc.text(xpoPart, startX, 22);
  doc.setTextColor(...C_TEXT);    doc.text('LOGISTICS', startX+doc.getTextWidth(xpoPart), 22);

  // Date — centered below logo
  const fecha=new Date();
  const fechaStr=fecha.toLocaleDateString('es-ES',{weekday:'long',day:'numeric',month:'long',year:'numeric'});
  doc.setFont('helvetica','normal');
  doc.setFontSize(9);
  doc.setTextColor(...C_MUTED);
  doc.text(fechaStr.charAt(0).toUpperCase()+fechaStr.slice(1), 105, 29, {align:'center'});

  // CODE label — right
  doc.setFont('helvetica','bold');
  doc.setFontSize(10);
  doc.setTextColor(10,132,255);
  doc.text('CODE', 194, 14, {align:'right'});
  doc.setFont('helvetica','normal');
  doc.setFontSize(7);
  doc.setTextColor(...C_MUTED);
  doc.text('XPO LOGISTICS', 194, 19, {align:'right'});

  // ── SUMMARY BADGES ───────────────────────────────────────
  function drawStatBadge(x, y, w, h, bgColor, textColor, label, count){
    doc.setFillColor(...bgColor);
    doc.setDrawColor(bgColor[0]-15, bgColor[1]-15, bgColor[2]-15);
    doc.setLineWidth(0.3);
    doc.roundedRect(x,y,w,h,h/2,h/2,'FD');
    // dot
    doc.setFillColor(...textColor);
    doc.circle(x+5, y+h/2, 1.8, 'F');
    // label
    doc.setFont('helvetica','bold');
    doc.setFontSize(7.5);
    doc.setTextColor(...textColor);
    doc.text(label, x+9, y+h/2+0.8, {baseline:'middle'});
    // count
    doc.setFont('helvetica','bold');
    doc.setFontSize(11);
    doc.setTextColor(...C_TEXT);
    doc.text(String(count), x+w-3, y+h/2+0.8, {align:'right', baseline:'middle'});
  }
  const bw=56, bh=11, by=35, bgap=6; let bx=15;
  drawStatBadge(bx,by,bw,bh,C_LOADED_BG,C_LOADED_TEXT,'CARGADAS',cargadas.length); bx+=bw+bgap;
  drawStatBadge(bx,by,bw,bh,C_EMPTY_BG,C_EMPTY_TEXT,'VACÍAS',vacias.length); bx+=bw+bgap;
  drawStatBadge(bx,by,bw,bh,C_BROKEN_BG,C_BROKEN_TEXT,'AVERIADAS',averiadas.length); bx+=bw+bgap;
  // Total
  doc.setFillColor(...C_BGSOFT);
  doc.setDrawColor(...C_LINE);
  doc.setLineWidth(0.3);
  doc.roundedRect(bx,by,bw,bh,bh/2,bh/2,'FD');
  doc.setFont('helvetica','bold');
  doc.setFontSize(7.5);
  doc.setTextColor(...C_MUTED);
  doc.text('TOTAL', bx+6, by+bh/2+0.8, {baseline:'middle'});
  doc.setFontSize(11);
  doc.setTextColor(...C_TEXT);
  doc.text(String(plataformas.length), bx+bw-3, by+bh/2+0.8, {align:'right',baseline:'middle'});

  // ── SECTION HEADER HELPER ────────────────────────────────
  function drawSectionHeader(x, y, w, label, color){
    doc.setFillColor(color[0],color[1],color[2],0.08);
    doc.setDrawColor(color[0]-10,color[1]-10,color[2]-10);
    doc.setLineWidth(0.3);
    doc.roundedRect(x,y,w,8,2,2,'FD');
    // colored left bar
    doc.setFillColor(...color);
    doc.roundedRect(x,y,2.5,8,1,1,'F');
    doc.setFont('helvetica','bold');
    doc.setFontSize(8.5);
    doc.setTextColor(...C_TEXT);
    doc.text(label, x+6, y+5.3);
  }

  // ── TABLE HELPERS ────────────────────────────────────────
  function drawTableHeader(x, y, w, cols){
    doc.setFillColor(...C_BGSOFT);
    doc.setDrawColor(...C_LINE);
    doc.setLineWidth(0.25);
    doc.rect(x,y,w,6,'FD');
    doc.setFont('helvetica','bold');
    doc.setFontSize(7.5);
    doc.setTextColor(...C_MUTED);
    cols.forEach(col=> doc.text(col.text, x+col.dx, y+4.3));
  }

  let yPos=54;
  const bottomMargin=262;

  function createTwoColTables(leftTitle, leftColor, leftData, rightTitle, rightColor, rightData, startY){
    let cy=startY;
    const lx=15, rx=110, cw=85;
    // Section headers
    if(leftData.length>0) drawSectionHeader(lx, cy, cw, `${leftTitle}  (${leftData.length})`, leftColor);
    if(rightData.length>0) drawSectionHeader(rx, cy, cw, `${rightTitle}  (${rightData.length})`, rightColor);
    cy+=11;
    // Column headers
    if(leftData.length>0) drawTableHeader(lx, cy, cw, [{text:'MATRÍCULA',dx:2},{text:'CONTENIDO',dx:33}]);
    if(rightData.length>0) drawTableHeader(rx, cy, cw, [{text:'MATRÍCULA',dx:2}]);
    cy+=8;
    doc.setFont('helvetica','normal'); doc.setFontSize(8); doc.setTextColor(...C_TEXT);
    const maxRows=Math.max(leftData.length,rightData.length);
    for(let i=0;i<maxRows;i++){
      if(i%2===0){
        if(leftData[i]){ doc.setFillColor(253,253,255); doc.rect(lx,cy-3,cw,6,'F'); }
        if(rightData[i]){ doc.setFillColor(253,253,255); doc.rect(rx,cy-3,cw,6,'F'); }
      }
      let rowExtra=0;
      if(leftData[i]){
        doc.setFont('helvetica','bold'); doc.setFontSize(8); doc.setTextColor(...C_TEXT);
        doc.text(leftData[i].matricula.toUpperCase(), lx+2, cy);
        if(leftData[i].contenido){
          doc.setFont('helvetica','normal'); doc.setFontSize(7.5); doc.setTextColor(...C_MUTED);
          const lines=doc.splitTextToSize(leftData[i].contenido.toUpperCase(),48);
          doc.text(lines, lx+33, cy);
          if(lines.length>1) rowExtra=Math.max(rowExtra,(lines.length-1)*3);
        }
      }
      if(rightData[i]){
        doc.setFont('helvetica','bold'); doc.setFontSize(8); doc.setTextColor(...C_TEXT);
        doc.text(rightData[i].matricula.toUpperCase(), rx+2, cy);
      }
      cy+=6+rowExtra;
      // Bottom row divider
      doc.setDrawColor(...C_LINE); doc.setLineWidth(0.18);
      if(leftData[i]) doc.line(lx,cy-3,lx+cw,cy-3);
      if(rightData[i]) doc.line(rx,cy-3,rx+cw,cy-3);
      if(cy>bottomMargin){ doc.addPage(); cy=28; }
    }
    return cy+10;
  }

  function createSingleTable(title, color, data, startY){
    if(!data.length) return startY;
    let cy=startY;
    drawSectionHeader(15, cy, 180, `${title}  (${data.length})`, color);
    cy+=11;
    drawTableHeader(15, cy, 180, [{text:'MATRÍCULA',dx:2},{text:'DESCRIPCIÓN / AVERÍA',dx:50}]);
    cy+=8;
    data.forEach((it,i)=>{
      if(i%2===0){ doc.setFillColor(253,253,255); doc.rect(15,cy-3,180,6,'F'); }
      doc.setFont('helvetica','bold'); doc.setFontSize(8); doc.setTextColor(...C_TEXT);
      doc.text(it.matricula.toUpperCase(), 17, cy);
      if(it.contenido){
        doc.setFont('helvetica','normal'); doc.setFontSize(7.5); doc.setTextColor(...C_MUTED);
        const lines=doc.splitTextToSize(it.contenido.toUpperCase(),122);
        doc.text(lines, 68, cy);
        if(lines.length>1) cy+=(lines.length-1)*3;
      }
      cy+=6;
      doc.setDrawColor(...C_LINE); doc.setLineWidth(0.18);
      doc.line(15,cy-3,195,cy-3);
      if(cy>bottomMargin){ doc.addPage(); cy=28; }
    });
    return cy+10;
  }

  if(cargadas.length>0||vacias.length>0)
    yPos=createTwoColTables('CARGADAS',C_LOADED_TEXT,cargadas,'VACÍAS',C_EMPTY_TEXT,vacias,yPos);
  if(averiadas.length>0)
    yPos=createSingleTable('AVERIADAS',C_BROKEN_TEXT,averiadas,yPos);

  // ── FOOTER ───────────────────────────────────────────────
  const pages=doc.internal.getNumberOfPages();
  for(let i=1;i<=pages;i++){
    doc.setPage(i);
    // Footer line
    doc.setDrawColor(...C_LINE); doc.setLineWidth(0.35);
    doc.line(10,278,200,278);
    doc.setFont('helvetica','normal'); doc.setFontSize(7.5); doc.setTextColor(...C_MUTED);
    doc.text('© 2026 XPO LOGISTICS – Informe interno', 15, 284);
    doc.setTextColor(...C_ACCENT);
    doc.textWithLink('vbenyx.github.io/dragos-/', 105, 284, {url:'https://vbenyx.github.io/dragos-/',align:'center'});
    doc.setTextColor(...C_MUTED);
    doc.text(`Página ${i} de ${pages}`, 192, 284, {align:'right'});
  }

  const d=new Date().toLocaleDateString('es-ES',{day:'2-digit',month:'2-digit',year:'numeric'}).replace(/\//g,'-');
  doc.save('reporte_plataformas_'+d+'.pdf');
}

/* ─── DOMContentLoaded ───────────────────────────────────── */
window.addEventListener('DOMContentLoaded', ()=>{
  loadData(); updateAll();

  // Restore draft
  const matInput=$('matriculaInput'), contInput=$('contenidoInput');
  try{
    const raw=localStorage.getItem('draft');
    if(raw){ const d=JSON.parse(raw); if(d.m&&matInput) matInput.value=d.m; if(d.c&&contInput) contInput.value=d.c; }
  }catch(e){}
  const saveDraft=()=>{
    try{ localStorage.setItem('draft',JSON.stringify({m:matInput?.value||'',c:contInput?.value||''})); }catch(e){}
  };
  if(matInput) matInput.addEventListener('input',saveDraft);
  if(contInput) contInput.addEventListener('input',saveDraft);

  // Search
  const searchInput=$('searchInput');
  if(searchInput) searchInput.addEventListener('input',()=>{ searchQuery=searchInput.value||''; renderCompactList(); });

  // Attach press ripple to all buttons
  document.querySelectorAll('.btn,.action-btn,.qa,.menu-trigger,.segment button').forEach(attachPressedEffect);

  // Flow listeners
  $('toS2')?.addEventListener('click', nextFromS1);
  $('back1')?.addEventListener('click', ()=>{ showStep(1,'back'); keepCardInView(); });
  $('back2')?.addEventListener('click', ()=>{ showStep(2,'back'); keepCardInView(); });
  $('btnCargada')?.addEventListener('click', ()=>chooseEstado('CARGADA'));
  $('btnVacia')?.addEventListener('click', ()=>chooseEstado('VACÍA'));
  $('btnAveriada')?.addEventListener('click', ()=>chooseEstado('AVERIADA'));
  $('btnRegistrar')?.addEventListener('click', registrar);
  $('editCancel')?.addEventListener('click', closeEditModal);
  $('editSave')?.addEventListener('click', saveEdit);
  document.addEventListener('keydown', e=>{ if(e.key==='Escape') closeEditModal(); });

  // Filter segment
  document.querySelectorAll('.compact-header [data-tab]').forEach(btn=>{
    btn.addEventListener('click', ()=>{
      document.querySelectorAll('.compact-header [data-tab]').forEach(b=>b.classList.remove('active'));
      btn.classList.add('active');
      currentTab=btn.getAttribute('data-tab')||'TODAS';
      updateAll();
    });
  });

  $('genPdf')?.addEventListener('click', ()=>{ keepCardInView(); generatePDF(); });

  // Scroll header effect
  window.addEventListener('scroll', ()=>{
    document.body.classList.toggle('scrolled', window.scrollY>40);
  }, {passive:true});
});

/* ─── DYNAMIC LIGHT MOUSE TRACKING ──────────────────────── */
document.addEventListener('mousemove', e=>{
  document.querySelectorAll('.dynamic-light').forEach(el=>{
    const r=el.getBoundingClientRect();
    el.style.setProperty('--mX', ((e.clientX-r.left)/r.width*100)+'%');
    el.style.setProperty('--mY', ((e.clientY-r.top)/r.height*100)+'%');
  });
}, {passive:true});
</script>
</body>
