<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="utf-8"/>
<meta content="width=device-width, initial-scale=1.0, user-scalable=no, maximum-scale=1.0, viewport-fit=cover" name="viewport"/>
<title>XPO — Registro de Plataformas </title>
<link rel="preconnect" href="https://cdnjs.cloudflare.com">
<style>
/* ============================================================
   XPO · Registro de Plataformas — App móvil (rediseño)
   ============================================================ */
*{box-sizing:border-box;text-decoration:none !important;}
html,h1,h2,h3,h4,p{margin:0}
button,input,textarea,select{font:inherit}
img,svg,video{display:block;max-width:100%}

:root{
 --xpo-red:#E30613;
 --xpo-red-dark:#C10513;
 --accent:#0A84FF;
 --ok:#12B76A;
 --warn:#F79009;
 --danger:#F04438;
 --bg-0:#F2F3F6;
 --bg-1:#FFFFFF;
 --ink:#12141A;
 --ink-soft:#525762;
 --ink-faint:#8A8F99;
 --line:#E7E8EC;
 --radius-lg:22px;
 --radius-md:16px;
 --radius-sm:11px;
 --shadow-card:0 1px 2px rgba(16,20,30,.04), 0 10px 28px -10px rgba(16,20,30,.14);
 --shadow-pop:0 18px 44px -14px rgba(16,20,30,.30);
 --ease:cubic-bezier(.22,1,.36,1);
 --mono:"SF Mono","JetBrains Mono",ui-monospace,Menlo,Consolas,monospace;
 --sans:-apple-system,BlinkMacSystemFont,"SF Pro Text","SF Pro Display","Segoe UI",Roboto,system-ui,sans-serif;
 --sat-top:env(safe-area-inset-top,0px);
 --sat-bottom:env(safe-area-inset-bottom,0px);
}
@media (prefers-reduced-motion: reduce){
 *{animation-duration:.001ms !important;animation-iteration-count:1 !important;transition-duration:.001ms !important;scroll-behavior:auto !important}
}
html{
 -webkit-font-smoothing:antialiased;-moz-osx-font-smoothing:grayscale;text-rendering:optimizeLegibility;
 scroll-behavior:smooth;
 background:var(--bg-0);
}
body{
 margin:0;
 font-family:var(--sans);
 color:var(--ink);
 background:
   radial-gradient(1100px 500px at 50% -10%, rgba(227,6,19,.05), transparent 60%),
   linear-gradient(180deg,#FAFAFC 0%, var(--bg-0) 40%);
 min-height:100vh;
 padding-top:var(--sat-top);
 padding-bottom:var(--sat-bottom);
}
input,textarea,button,select{font-size:16px}
button{touch-action:manipulation;-webkit-tap-highlight-color:transparent;cursor:pointer;font-family:var(--sans)}

/* ---------- shell ---------- */
.app{
 max-width:480px;margin:0 auto;
 padding:14px 14px calc(96px + var(--sat-bottom)) 14px;
 position:relative;
}
@media (min-width:560px){ .app{max-width:560px} }

/* ---------- header ---------- */
.header{
 position:sticky;top:calc(10px + var(--sat-top));z-index:20;
 border-radius:20px;padding:14px 16px;
 background:rgba(255,255,255,.78);
 border:1px solid rgba(20,20,25,.06);
 backdrop-filter:saturate(1.6) blur(20px);-webkit-backdrop-filter:saturate(1.6) blur(20px);
 box-shadow:0 1px 1px rgba(16,20,30,.03), 0 14px 30px -16px rgba(16,20,30,.16);
 transition:box-shadow .25s var(--ease);
 margin-bottom:14px;
}
body.scrolled .header{box-shadow:0 2px 4px rgba(16,20,30,.06), 0 18px 34px -14px rgba(16,20,30,.22);}
.brand{display:flex;align-items:center;justify-content:center;gap:8px}
.chip{
 font-size:10px;font-weight:800;letter-spacing:.08em;color:#fff;
 background:linear-gradient(135deg,var(--xpo-red),var(--xpo-red-dark));
 padding:4px 8px;border-radius:8px;position:relative;overflow:hidden;
 box-shadow:0 4px 10px -3px rgba(227,6,19,.55);
}
.chip::after{
 content:"";position:absolute;top:-50%;left:-30%;width:50%;height:200%;
 background:linear-gradient(120deg,rgba(255,255,255,0) 0%,rgba(255,255,255,.55) 50%,rgba(255,255,255,0) 100%);
 transform:rotate(12deg);animation:shimmer 4s infinite linear;pointer-events:none;
}
@keyframes shimmer{0%{transform:translateX(-140%) rotate(12deg)}100%{transform:translateX(240%) rotate(12deg)}}
.logo-svg{display:flex;align-items:center}
.logo-svg svg{width:132px !important;height:auto}
.ani-pop{animation:popIn .5s var(--ease) both}
.ani-fade{animation:fadeSlide .7s var(--ease) both .1s}
@keyframes popIn{0%{opacity:0;transform:translateY(5px) scale(.94)}100%{opacity:1;transform:none}}
@keyframes fadeSlide{0%{opacity:0;letter-spacing:.1em}100%{opacity:1;letter-spacing:normal}}
.headline{
 margin-top:6px;text-align:center;font-weight:600;font-size:14px;
 color:var(--ink-soft);letter-spacing:.02em;
}

/* ---------- generic cards ---------- */
.card,.panel,.compact{
 background:var(--bg-1);
 border:1px solid rgba(20,20,25,.06);
 border-radius:var(--radius-lg);
 box-shadow:var(--shadow-card);
 margin-bottom:14px;
 overflow:hidden;
 position:relative;
}
.panel{padding:18px}
.panel.actions{
 display:flex;gap:10px;padding:10px;background:transparent;border:0;box-shadow:none;
}
.card.fade-in,.panel.fade-in,.compact.fade-in,header.fade-in{animation:cardIn .45s var(--ease) both}
@keyframes cardIn{0%{opacity:0;transform:translateY(10px)}100%{opacity:1;transform:none}}

/* subtle cursor-follow glow on dynamic-light cards (desktop only, harmless on touch) */
.dynamic-light{
 background-image:radial-gradient(360px 220px at var(--mX,50%) var(--mY,0%), rgba(227,6,19,.05), transparent 60%);
}

/* ---------- flow card (wizard) ---------- */
#flowCard{padding:0}
.card-header{
 display:flex;align-items:center;justify-content:center;gap:10px;
 padding:16px 16px 6px;
}
.chevron{display:none}
.title-lg{font-weight:700;font-size:16px;letter-spacing:.01em}
.card-content{position:relative;min-height:200px}
.screen{
 position:absolute;inset:0;padding:6px 20px 22px;
 display:flex;flex-direction:column;gap:12px;align-items:stretch;justify-content:flex-start;
 opacity:0;transform:translateX(18px) scale(.98);pointer-events:none;
 transition:opacity .38s var(--ease), transform .38s var(--ease);
}
.screen.active{position:relative;opacity:1;transform:none;pointer-events:auto}
.screen.out-left{animation:slideOutL .34s var(--ease)}
.screen.out-right{animation:slideOutR .34s var(--ease)}
@keyframes slideOutL{from{opacity:1;transform:none}to{opacity:0;transform:translateX(-18px) scale(.98)}}
@keyframes slideOutR{from{opacity:1;transform:none}to{opacity:0;transform:translateX(18px) scale(.98)}}
.flash-once{animation:flashBg .9s var(--ease)}
@keyframes flashBg{0%{background:rgba(18,183,106,0)}30%{background:rgba(18,183,106,.10)}100%{background:rgba(18,183,106,0)}}

.meta{display:flex;flex-wrap:wrap;align-items:baseline;justify-content:center;gap:5px 8px;text-align:center}
.meta .item{color:var(--ink-faint);font-size:13px;font-weight:500}
.meta strong{color:var(--ink);font-family:var(--mono);font-weight:700;letter-spacing:.02em}

.input,.textarea{
 width:100%;padding:14px 15px;border-radius:var(--radius-md);
 border:1.5px solid var(--line);background:#FBFBFD;color:var(--ink);
 outline:none;transition:border-color .18s var(--ease), box-shadow .18s var(--ease), background .18s var(--ease);
 font-weight:500;
}
.input:focus,.textarea:focus{border-color:var(--accent);background:#fff;box-shadow:0 0 0 4px rgba(10,132,255,.14)}
.textarea{min-height:96px;resize:vertical;line-height:1.45}
.row{display:flex;gap:10px;flex-wrap:wrap;width:100%}
.row.states{display:grid;grid-template-columns:1fr;gap:10px;width:100%}

.btn{
 position:relative;display:flex;align-items:center;justify-content:center;gap:8px;
 min-height:50px;padding:12px 16px;border:1.5px solid var(--line);border-radius:var(--radius-md);
 color:var(--ink);background:#F5F6F8;font-weight:600;letter-spacing:.01em;
 transition:transform .15s var(--ease), background .15s var(--ease), border-color .15s var(--ease), box-shadow .15s var(--ease);
 overflow:hidden;
}
.btn:active{transform:scale(.97)}
.btn:disabled{opacity:.55}
.btn-primary{background:linear-gradient(180deg,#0d8bff,var(--accent));color:#fff;border-color:transparent;box-shadow:0 8px 18px -8px rgba(10,132,255,.55)}
.btn-primary:hover{filter:brightness(1.03)}
.btn-secondary{background:#F0F1F4;color:var(--ink-soft)}
.btn::after{content:"";position:absolute;left:var(--px,50%);top:var(--py,50%);width:0;height:0;border-radius:999px;opacity:0;pointer-events:none;background:rgba(255,255,255,.55);transform:translate(-50%,-50%);}
.btn.pressed::after{animation:pressPulse .5s var(--ease) forwards}
@keyframes pressPulse{0%{opacity:.4;width:0;height:0}70%{opacity:.12;width:220%;height:220%}100%{opacity:0;width:260%;height:260%}}

.state-icon{width:20px;height:20px;flex:0 0 auto}
.btn[id^="btn"].selected,.states .btn.selected{
 border-color:var(--accent);background:rgba(10,132,255,.10);box-shadow:0 0 0 3px rgba(10,132,255,.14);
}
#btnCargada{border-left:4px solid var(--ok)}
#btnVacia{border-left:4px solid var(--accent)}
#btnAveriada{border-left:4px solid var(--warn)}

.steps{display:flex;justify-content:center;gap:9px;padding:16px 0 18px}
.dot{width:8px;height:8px;border-radius:999px;background:#DADCE2;transition:all .25s var(--ease)}
.dot.active{background:var(--xpo-red);transform:scale(1.5)}

/* ---------- action bar (bottom, app-like) ---------- */
.panel.actions{
 position:fixed;left:0;right:0;bottom:0;z-index:15;
 max-width:480px;margin:0 auto;padding:10px 14px calc(12px + var(--sat-bottom));
 background:rgba(250,250,252,.9);backdrop-filter:blur(18px) saturate(1.4);-webkit-backdrop-filter:blur(18px) saturate(1.4);
 border-top:1px solid var(--line);
}
@media (min-width:560px){ .panel.actions{max-width:560px} }
.action-btn{
 flex:1;display:flex;align-items:center;justify-content:center;gap:7px;
 border:1.5px solid var(--line);background:#fff;padding:12px 10px;border-radius:14px;
 font-weight:600;font-size:13.5px;color:var(--ink-soft);
 transition:transform .15s var(--ease), background .15s var(--ease);
 position:relative;overflow:visible;
}
.action-btn:active{transform:scale(.97)}
.action-btn.danger{color:var(--danger);border-color:rgba(240,68,56,.25);background:rgba(240,68,56,.06)}
#clearHoldBar{position:absolute;left:0;bottom:0;height:3px;width:0%;background:var(--danger);border-radius:0 0 12px 12px}

/* ---------- summary pills ---------- */
.pills{display:grid;grid-template-columns:1fr 1fr;gap:10px}
.pill{
 position:relative;overflow:hidden;border:1px solid var(--line);border-radius:var(--radius-md);
 padding:14px 14px;background:#FBFBFD;
}
.pill::before{
 content:"";position:absolute;inset:0;width:var(--fill,0%);
 background:linear-gradient(90deg,rgba(10,132,255,.08),rgba(10,132,255,.16));
 transition:width .3s var(--ease);
}
#pillCargadas::before{background:linear-gradient(90deg,rgba(18,183,106,.08),rgba(18,183,106,.18))}
#pillAveriadas::before{background:linear-gradient(90deg,rgba(247,144,9,.08),rgba(247,144,9,.18))}
.pill.update::after{
 content:"";position:absolute;top:0;bottom:0;width:26%;left:-30%;
 background:linear-gradient(90deg,rgba(255,255,255,0) 0%,rgba(255,255,255,.75) 50%,rgba(255,255,255,0) 100%);
 animation:pillShine 1s var(--ease);
}
@keyframes pillShine{0%{left:-30%}100%{left:120%}}
.pill-inner{position:relative;z-index:1;display:flex;flex-direction:column;gap:6px}
.pill .label{font-size:12px;font-weight:600;color:var(--ink-faint);order:2}
.pill .val{font-family:var(--mono);font-size:24px;font-weight:700;color:var(--ink);order:1;font-variant-numeric:tabular-nums}
.pill-val-update{animation:pulseVal .3s ease-out}
@keyframes pulseVal{0%{transform:scale(1)}45%{transform:scale(1.1)}100%{transform:scale(1)}}

/* ---------- compact / filters / list ---------- */
.compact-header{
 position:sticky;top:0;z-index:5;padding:14px 14px 10px;
 background:linear-gradient(180deg,#fff,rgba(255,255,255,.85));
 border-bottom:1px solid var(--line);
 display:flex;flex-direction:column;gap:10px;
}
.segment{display:flex;gap:6px;flex-wrap:wrap}
.segment button{
 display:inline-flex;align-items:center;gap:6px;padding:7px 11px;border-radius:999px;
 border:1px solid var(--line);background:#F5F6F8;font-size:12.5px;font-weight:600;color:var(--ink-soft);
 transition:all .15s var(--ease);
}
.segment button::before{content:"";width:6px;height:6px;border-radius:50%;background:#C9CCD3}
.segment button[data-tab="CARGADA"]::before{background:var(--ok)}
.segment button[data-tab="VACÍA"]::before{background:var(--accent)}
.segment button[data-tab="AVERIADA"]::before{background:var(--warn)}
.segment button[data-tab="TODAS"]::before{background:linear-gradient(135deg,var(--accent),var(--ok))}
.segment button.active{background:rgba(10,132,255,.12);border-color:rgba(10,132,255,.35);color:var(--ink)}
.segment button[data-tab="CALL"]{margin-left:auto;color:var(--accent);border-color:rgba(10,132,255,.25)}
.segment button.call-alert{border-color:rgba(240,68,56,.4);color:var(--danger);animation:callPulse 1.4s ease-in-out infinite}
@keyframes callPulse{0%,100%{box-shadow:0 0 0 0 rgba(240,68,56,.25)}50%{box-shadow:0 0 0 6px rgba(240,68,56,0)}}
.segment .badge{margin-left:2px;padding:1px 6px;border-radius:999px;font-size:10.5px;font-weight:700;background:rgba(10,132,255,.10);color:var(--accent)}
.notif-badge{font-size:9px !important;line-height:1.4}

.search-input{padding:11px 14px;border-radius:12px;font-size:14px}

.compact-body{padding:6px 12px 14px;min-height:60px}
.record{
 border:1px solid var(--line);border-radius:14px;padding:12px 13px;margin-bottom:8px;background:#fff;
 position:relative;padding-left:16px;cursor:pointer;
 animation:recordEntry .3s ease-out;
 transition:box-shadow .18s var(--ease);
}
@keyframes recordEntry{0%{opacity:0;transform:translateY(6px)}100%{opacity:1;transform:none}}
.record::before{content:"";position:absolute;left:0;top:10px;bottom:10px;width:3px;border-radius:3px;background:#D9DBE1}
.record[data-estado="CARGADA"]::before{background:var(--ok)}
.record[data-estado="VACÍA"]::before{background:var(--accent)}
.record[data-estado="AVERIADA"]::before{background:var(--warn)}
.record.expanded{box-shadow:0 6px 18px -8px rgba(16,20,30,.18)}
.record.highlight-dup{animation:dupPulse 1.2s ease}
@keyframes dupPulse{0%{box-shadow:0 0 0 0 rgba(247,144,9,.4)}50%{box-shadow:0 0 0 6px rgba(247,144,9,0)}100%{box-shadow:none}}
.rowline{display:flex;align-items:center;justify-content:space-between;gap:8px}
.rowline .mat{font-family:var(--mono);font-weight:700;font-size:14.5px;letter-spacing:.02em}
.rowline .ts{font-size:11px;color:var(--ink-faint);font-family:var(--mono)}
.rowline .est{font-size:10.5px;font-weight:700;letter-spacing:.03em;padding:2px 7px;border-radius:999px;background:#F0F1F4;color:var(--ink-soft)}
.record[data-estado="CARGADA"] .est{background:rgba(18,183,106,.12);color:#0a7a49}
.record[data-estado="VACÍA"] .est{background:rgba(10,132,255,.12);color:#0a63c4}
.record[data-estado="AVERIADA"] .est{background:rgba(247,144,9,.14);color:#a05c05}
.record .content{font-size:13.5px;color:var(--ink-soft);line-height:1.5;padding-top:8px}
.record .actions{display:flex;justify-content:flex-end;gap:8px;padding-top:8px}
.record .actions .action-btn{flex:0 0 auto;padding:6px 12px;font-size:12px;min-height:auto;border-radius:9px}

/* ---------- toast / dynamic island ---------- */
.toast{display:none}
#dynamicIsland{
 position:fixed;left:50%;top:calc(10px + var(--sat-top));transform:translateX(-50%) scale(.92);
 z-index:60;display:flex;align-items:center;gap:8px;
 background:rgba(20,20,24,.92);color:#fff;padding:10px 16px;border-radius:999px;
 font-size:13px;font-weight:600;box-shadow:0 14px 34px -10px rgba(0,0,0,.5);
 border:1px solid rgba(255,255,255,.14);
 opacity:0;pointer-events:none;transition:opacity .25s var(--ease), transform .25s var(--ease);
 max-width:88vw;
}
#dynamicIsland.di-hidden{display:none}
#dynamicIsland.di-show{opacity:1;transform:translateX(-50%) scale(1)}
#dynamicIsland.di-hide{opacity:0;transform:translateX(-50%) scale(.94)}
#dynamicIsland .bar{display:none}

/* ---------- modal ---------- */
.modal{position:fixed;inset:0;display:none;align-items:flex-end;justify-content:center;z-index:70;background:rgba(10,10,14,.42);backdrop-filter:blur(2px)}
.modal.open{display:flex;animation:modalBg .2s ease}
@keyframes modalBg{from{opacity:0}to{opacity:1}}
.modal-card{
 width:100%;max-width:480px;background:#fff;border-radius:24px 24px 0 0;
 padding:20px 18px calc(20px + var(--sat-bottom));display:flex;flex-direction:column;gap:12px;
 box-shadow:0 -20px 50px rgba(0,0,0,.25);
 animation:modalUp .28s var(--ease);
}
@media (min-width:560px){ .modal{align-items:center} .modal-card{border-radius:22px;max-width:420px} }
@keyframes modalUp{from{transform:translateY(24px);opacity:.6}to{transform:none;opacity:1}}
.modal-title{font-weight:700;font-size:17px;text-align:center;margin-bottom:2px}
.modal-row{display:grid;grid-template-columns:1fr 1fr;gap:10px}
.modal-actions{display:flex;gap:10px;justify-content:flex-end;margin-top:4px}
.modal-actions .btn{flex:1}
select{padding:12px 14px;border-radius:12px;border:1.5px solid var(--line);background:#FBFBFD;font-weight:500}
@media (max-width:420px){.modal-row{grid-template-columns:1fr}}

h3.section-title{
 text-align:center;font-size:12px;font-weight:700;letter-spacing:.08em;
 color:var(--ink-faint);text-transform:uppercase;margin-bottom:12px;
}

::selection{background:rgba(227,6,19,.18)}
::-webkit-scrollbar{width:0;height:0}
</style>
<script>
(function(){
 try{
 const dpr = window.devicePixelRatio || 1;
 if(dpr < 1.5) return;
 const want = dpr >= 3 ? '3x' : '2x';
 document.addEventListener('DOMContentLoaded', () => {
 const imgs = Array.from(document.querySelectorAll('img[data-2x], img[data-3x]'));
 imgs.forEach(img => {
 if (img.hasAttribute('srcset')) return;
 const src3 = img.getAttribute('data-3x');
 const src2 = img.getAttribute('data-2x');
 if (want === '3x' && src3) {
 img.src = src3;
 } else if ((want === '3x' && !src3 && src2) || (want === '2x' && src2)) {
 img.src = src2;
 }
 if (!img.hasAttribute('data-natural-width') && img.naturalWidth) {
 img.setAttribute('data-natural-width', img.naturalWidth);
 }
 });
 const bgEls = Array.from(document.querySelectorAll('[data-bg-2x], [data-bg-3x]'));
 bgEls.forEach(el => {
 const bg3 = el.getAttribute('data-bg-3x');
 const bg2 = el.getAttribute('data-bg-2x');
 if (want === '3x' && bg3) {
 el.style.backgroundImage = `url('')`;
 } else if ((want === '3x' && !bg3 && bg2) || (want === '2x' && bg2)) {
 el.style.backgroundImage = `url('')`;
 }
 });
 });
 } catch(e) {
 console.warn('DPR-swap script failed', e);
 }

<script src="https://cdnjs.cloudflare.com/ajax/libs/jspdf/2.5.1/jspdf.umd.min.js"></script>
<script>
const $ = id => document.getElementById(id);
const fmtHour = () => new Date().toLocaleTimeString('es-ES',{hour:'2-digit',minute:'2-digit',second:'2-digit'});
let plataformas = []; let currentMatricula = ''; let currentEstado = '';
let currentTab = 'TODAS'; let editingId = null; let searchQuery = '';
const STORAGE_KEY = 'plataformas-global';
function loadData(){ try{ const raw=localStorage.getItem(STORAGE_KEY); plataformas = raw ? JSON.parse(raw) : []; }catch(e){ plataformas = []; } }
function saveData(){ try{ localStorage.setItem(STORAGE_KEY, JSON.stringify(plataformas)); }catch(e){} }
function keepCardInView(){ const card = $('flowCard'); if(!card) return; const rect = card.getBoundingClientRect();
 if(rect.top < 12 || rect.bottom > (window.innerHeight - 12)){ card.scrollIntoView({behavior:'smooth', block:'start'}); } }
function attachPressedEffect(el){
 if(!el) return;
 el.addEventListener('pointerdown', (ev)=>{
 const r = el.getBoundingClientRect();
 const x = Math.round(ev.clientX - r.left), y = Math.round(ev.clientY - r.top);
 el.style.setProperty('--px', x+'px'); el.style.setProperty('--py', y+'px');
 el.classList.add('pressed');
 });
 ['pointerup','pointerleave','pointercancel'].forEach(evt=>{
 el.addEventListener(evt, ()=>setTimeout(()=>el.classList.remove('pressed'), 180));
 });
}
function showIsland(text = "Acción completada", duration = 1600){
 const island = $('dynamicIsland'); const textEl = $('diText'); const bar = $('diBar');
 if(!island || !textEl) return;
 textEl.textContent = text;
 island.classList.remove('di-hide','di-hidden'); island.classList.add('di-show');
 if(bar) { bar.style.width = '0%'; setTimeout(()=>bar.style.width='100%', 20); }
 if(window.__islandTimer) clearTimeout(window.__islandTimer);
 window.__islandTimer = setTimeout(()=>{
 island.classList.remove('di-show'); island.classList.add('di-hide');
 setTimeout(()=>{ island.classList.remove('di-hide'); island.classList.add('di-hidden'); }, 260);
 }, duration);
}
function toast(msg='Registro guardado'){ showIsland(msg, 1800); }
function animateNumber(el, target){
 if(!el) return; const start = Number(el.textContent)||0; const diff = target - start;
 if(diff === 0) { el.textContent = target; return; }
 const dur = 420; const startT = performance.now();
 function step(t){
 const p = Math.min(1, (t-startT)/dur);
 el.textContent = Math.round(start + diff * p);
 if(p < 1) requestAnimationFrame(step);
 }
 requestAnimationFrame(step);
}
function setFill(pillId, pct){ const el = $(pillId); if(!el) return;
 requestAnimationFrame(()=>{ el.style.setProperty('--fill', Math.max(0, Math.min(100, pct)).toFixed(0) + '%'); }); }
function renderCompactList(){
 const box = $('recordsContainer'); if(!box) return;
 const base = currentTab === 'TODAS'
 ? plataformas.slice().reverse()
 : plataformas.filter(p=>p.estado === currentTab).slice().reverse();
 const q = (searchQuery || '').trim().toLowerCase();
 const data = q
 ? base.filter(it =>
 (it.matricula || '').toLowerCase().includes(q) ||
 ((it.contenido || '').toLowerCase().includes(q))
 )
 : base;
 box.innerHTML = data.map(it=>`
 <div class="record" data-id="${it.id}" data-estado="${it.estado}">
 <div class="rowline">
 <div class="mat">${it.matricula}</div>
 <div style="display:flex;gap:8px;align-items:center;">
 <div class="ts">${it.timestamp||''}</div>
 <div class="est">${it.estado}</div>
 </div>
 </div>
 <div class="content" style="white-space:pre-wrap; display:none">${(it.contenido||'')}</div>
 <div class="actions" style="display:none">
 <button class="action-btn qa" data-action="edit">Editar</button>
 <button class="action-btn qa" data-action="delete">Eliminar</button>
 </div>
 </div>
 `).join('') || '<div style="opacity:.6;text-align:center;padding:18px">No hay registros</div>';
}
function updateAll(){
 const cargadas = plataformas.filter(p=>p.estado==='CARGADA');
 const vacias = plataformas.filter(p=>p.estado==='VACÍA');
 const averiadas = plataformas.filter(p=>p.estado==='AVERIADA');
 const total = plataformas.length || 1;
 animateNumber($('cargadasCount'), cargadas.length);
 animateNumber($('vaciasCount'), vacias.length);
 animateNumber($('averiadasCount'), averiadas.length);
 animateNumber($('totalCount'), plataformas.length);
 setFill('pillCargadas', cargadas.length/total*100);
 setFill('pillVacias', vacias.length/total*100);
 setFill('pillAveriadas', averiadas.length/total*100);
 setFill('pillTotal', 100);
 $('bAll').textContent = plataformas.length;
 $('bCargadas').textContent = cargadas.length;
 $('bVacias').textContent = vacias.length;
 $('bAveriadas').textContent = averiadas.length;
 renderCompactList();
}
function openEditModal(id){
 const it = plataformas.find(p=>p.id===id); if(!it) return;
 editingId = id;
 $('editMatricula').value = it.matricula;
 $('editEstado').value = it.estado;
 $('editContenido').value = it.contenido || '';
 const modal = $('editModal');
 modal.classList.add('open'); modal.setAttribute('aria-hidden','false');
 setTimeout(()=>{ modal.querySelector('input, textarea, select')?.focus(); }, 120);
}
function closeEditModal(){
 const modal = $('editModal');
 modal.classList.remove('open'); modal.setAttribute('aria-hidden','true');
 editingId = null;
}
function saveEdit(){
 if(editingId==null) return;
 const idx = plataformas.findIndex(p=>p.id===editingId); if(idx<0) return;
 const m = $('editMatricula').value.trim().toUpperCase();
 const e = $('editEstado').value;
 const c = $('editContenido').value.trim();
 if(!m){ alert('La matrícula no puede estar vacía'); return; }
 plataformas[idx].matricula = m; plataformas[idx].estado = e; plataformas[idx].contenido = c;
 saveData(); updateAll(); closeEditModal(); toast('Registro actualizado');
}
function deleteRecord(id){
 const it = plataformas.find(p=>p.id===id); if(!it) return;
 if(!confirm('¿Eliminar este registro?')) return;
 plataformas = plataformas.filter(p=>p.id!==id); saveData(); updateAll(); toast('Registro eliminado');
}
let step = 1;
function showStep(next, dir='forward'){
 const cur = $('s'+step), nxt = $('s'+next); if(!nxt || cur===nxt) return;
 cur.classList.remove('active'); cur.classList.add(dir==='forward' ? 'out-left':'out-right');
 setTimeout(()=>{ cur.classList.remove('out-left','out-right'); }, 360);
 nxt.classList.add('active');
 $('d1').classList.toggle('active', next===1); $('d2').classList.toggle('active', next===2); $('d3').classList.toggle('active', next===3);
 $('flowTitle').textContent = next===1 ? 'Matrícula' : next===2 ? 'Estado' : 'Contenido';
 step = next;
 requestAnimationFrame(()=>{
 try{ nxt.focus({preventScroll:true}); }catch(e){}
 keepCardInView();
 });
}
function nextFromS1(){
 const m = $('matriculaInput').value.trim().toUpperCase();
 if(!m){ alert('Por favor, introduce una matrícula válida'); keepCardInView(); return; }
 currentMatricula = m; $('matriculaDisplay').textContent = m; $('matriculaDisplay2').textContent = m;
 showStep(2,'forward');
}
function chooseEstado(estado){
 currentEstado = estado; $('estadoDisplay').textContent = estado;
 if(estado==='VACÍA'){
 if(!currentMatricula){ alert('Introduce primero una matrícula válida'); showStep(1,'back'); return; }
 const dup = plataformas.some(p => p.matricula===currentMatricula && p.estado==='VACÍA');
 if(dup){
 // Mostrar aviso suave y resaltar el último registro VACÍA existente
 toast('Esta matrícula ya fue registrada como VACÍA');
 try{
 const last = plataformas.filter(p=>p.matricula===currentMatricula && p.estado==='VACÍA').slice(-1)[0];
 if(last){
 updateAll();
 requestAnimationFrame(()=>{
 const rec = document.querySelector(`.record[data-id="${last.id}"]`);
 if(rec){
 rec.classList.add('highlight-dup');
 try{ rec.scrollIntoView({behavior:'smooth', block:'center'}); }catch(e){}
 setTimeout(()=>{ rec.classList.remove('highlight-dup'); }, 1200);
 }
 });
 }
 }catch(e){}
 return;
 }
 plataformas.push({ id:Date.now(), matricula:currentMatricula, estado, contenido:'', timestamp:fmtHour() });
 saveData(); updateAll(); flashSuccess(); resetFlow(); keepCardInView();
 } else {
 showStep(3,'forward');
 }
}
function registrar(){
 const contenido = $('contenidoInput').value.trim();
 if(!contenido){ alert('Describe el contenido o el problema'); keepCardInView(); return; }
 plataformas.push({ id:Date.now(), matricula:currentMatricula, estado:currentEstado, contenido, timestamp:fmtHour() });
 saveData(); updateAll();
 const btn=$('btnRegistrar'); const prev=btn.textContent;
 btn.disabled=true; btn.textContent='Registrando…';
 setTimeout(()=>{ btn.textContent='Registrado ✓';
 setTimeout(()=>{ btn.disabled=false; btn.textContent=prev; flashSuccess(); resetFlow(); keepCardInView(); }, 600);
 }, 360);
}
function resetFlow(){
 $('matriculaInput').value='';
 $('contenidoInput').value='';
 currentMatricula='';
 currentEstado='';
 try{ localStorage.removeItem('draft'); }catch(e){}
 showStep(1,'back');
}
function flashSuccess(){ const active = document.querySelector('.screen.active'); if(active){ active.classList.remove('flash-once'); void active.offsetWidth; active.classList.add('flash-once'); } toast('Registro guardado'); }
function generatePDF(){
 const registrador = (prompt('Nombre de quien realizó el registro:','') || '').trim();
 if(!registrador){ return; }
 const { jsPDF } = window.jspdf || {};
 if(!jsPDF){ alert('No se pudo cargar jsPDF. Revisa tu conexión.'); return; }
 const doc = new jsPDF({ unit: 'mm', format: 'a4' });
 const TEXT=[17,20,24], MUTED=[106,111,117], LINE=[230,230,234], PANEL=[255,255,255], SOFT=[245,246,247];
 const BADGE_RED=[254,226,226], BADGE_GREEN=[237,249,237], BADGE_ORNG=[255,245,230];
 const cargadas = plataformas.filter(p => p.estado === 'CARGADA');
 const vacias = plataformas.filter(p => p.estado === 'VACÍA');
 const averiadas = plataformas.filter(p => p.estado === 'AVERIADA');
 // Cabecera
 doc.setFillColor(...PANEL); doc.roundedRect(10,8,190,36,5,5,'F');
 doc.setDrawColor(...LINE); doc.roundedRect(10,8,190,36,5,5); doc.setDrawColor(210,210,214); doc.line(10,44,200,44);
 // Etiqueta premium minimal registrador
 const regLabel='REGISTRADO POR';
 const regName=registrador.toUpperCase();
 doc.setDrawColor(210,210,214);
 doc.setLineWidth(0.6);
 doc.line(14,12,14,22);
 doc.setFont('helvetica','bold');
 doc.setFontSize(6.5);
 doc.setTextColor(120,124,130);
 doc.text(regLabel,18,15);
 doc.setFont('helvetica','bold');
 doc.setFontSize(9);
 doc.setTextColor(35,35,38);
 doc.text(regName,18,20);

 doc.setFont('helvetica','bold'); doc.setFontSize(11); doc.setTextColor(40,40,40); doc.text('CODE', 195, 14, { align: 'right' });
 doc.setFont('helvetica','bold'); doc.setFontSize(18);
 const full = 'XPO LOGISTICS'; const xpoPart = 'XPO '; const startX = 105 - (doc.getTextWidth(full) / 2);
 doc.setTextColor(229,57,53); doc.text(xpoPart, startX, 22); // rojo XPO
 const nextX = startX + doc.getTextWidth(xpoPart);
 doc.setTextColor(...TEXT); doc.text('LOGISTICS', nextX, 22); // negro LOGISTICS
 // ---- Fecha en letras, gris claro, centrada bajo el logo ----
 (function(){
 const fecha = new Date();
 const fechaLarga = fecha.toLocaleDateString('es-ES', {
 weekday: 'long', day: 'numeric', month: 'long', year: 'numeric'
 });
 const fechaFinal = fechaLarga.charAt(0).toUpperCase() + fechaLarga.slice(1);
 doc.setFont('helvetica','normal');
 doc.setFontSize(10);
 doc.setTextColor(150,150,155);
 doc.text(fechaFinal, 105, 28, { align: 'center' });
 })();
 function drawBadge(x,y,w,h,bg,label,num,numColor){
 doc.setFillColor(...bg); doc.roundedRect(x,y,w,h, h/2, h/2, 'F');
 doc.setDrawColor(...LINE); doc.roundedRect(x,y,w,h, h/2, h/2);
 doc.setFont('helvetica','bold'); doc.setFontSize(8.5); doc.setTextColor(...TEXT);
 doc.text(label, x+7, y+h/2+2, { align:'left' });
 doc.setTextColor(...numColor); doc.text(String(num), x+w-7, y+h/2+2, { align:'right' });
 }
 const usable = 180, gap = 8, w = (usable - gap*2)/3, h = 10, y = 32; let x = 15;
 drawBadge(x,y,w,h,BADGE_RED,'CARGADAS',cargadas.length,[180,30,50]); x+=w+gap;
 drawBadge(x,y,w,h,BADGE_GREEN,'VACÍAS',vacias.length,[16,185,129]); x+=w+gap;
 drawBadge(x,y,w,h,BADGE_ORNG,'AVERIADAS',averiadas.length,[200,110,20]);
 // Tablas
 let yPosition = 52; const bottomMargin = 260;
 function createTwoColumnTables(leftTitle,leftData,rightTitle,rightData,startY){
 let currentY=startY; const leftX=15; const rightX=110; const columnWidth=85;
 doc.setFont('helvetica','bold'); doc.setFontSize(12); doc.setTextColor(...TEXT);
 if(leftData.length>0) doc.text((leftTitle+' ('+leftData.length+')').toUpperCase(),leftX,currentY);
 if(rightData.length>0) doc.text((rightTitle+' ('+rightData.length+')').toUpperCase(),rightX,currentY);
 currentY+=8;
 if(leftData.length>0){
 doc.setFillColor(...SOFT); doc.rect(leftX,currentY-4,columnWidth,7,'F');
 doc.setFont('helvetica','bold'); doc.setFontSize(9); doc.setTextColor(...MUTED);
 doc.text('MATRÍCULA',leftX+2,currentY); doc.text('CONTENIDO',leftX+35,currentY);
 }
 if(rightData.length>0){
 doc.setFillColor(...SOFT); doc.rect(rightX,currentY-4,columnWidth,7,'F');
 doc.setFont('helvetica','bold'); doc.setFontSize(9); doc.setTextColor(...MUTED);
 doc.text('MATRÍCULA',rightX+2,currentY);
 }
 currentY+=8; doc.setFont('helvetica','normal'); doc.setFontSize(8); doc.setTextColor(...TEXT);
 const maxRows=Math.max(leftData.length,rightData.length);
 for(let i=0;i<maxRows;i++){
 if(i%2===0){
 if(leftData[i]){doc.setFillColor(252,253,255);doc.rect(leftX,currentY-3,columnWidth,6,'F');}
 if(rightData[i]){doc.setFillColor(252,253,255);doc.rect(rightX,currentY-3,columnWidth,6,'F');}
 }
 if(leftData[i]){
 doc.text(leftData[i].matricula.toUpperCase(),leftX+2,currentY);
 if(leftData[i].contenido){
 const lines=doc.splitTextToSize(leftData[i].contenido.toUpperCase(),45);
 doc.text(lines,leftX+35,currentY);
 if(lines.length>1) currentY+=(lines.length-1)*3;
 }
 }
 if(rightData[i]){ doc.text(rightData[i].matricula.toUpperCase(),rightX+2,currentY); }
 currentY+=6;
 if(currentY>bottomMargin){ doc.addPage(); currentY=30; }
 }
 return currentY+10;
 }
 function createSingleTable(title,data,startY){
 let currentY=startY; if(data.length===0) return currentY;
 doc.setFont('helvetica','bold'); doc.setFontSize(12); doc.setTextColor(...TEXT); doc.text((title+' ('+data.length+')').toUpperCase(),15,currentY); currentY+=8;
 doc.setFillColor(...SOFT); doc.rect(15,currentY-4,180,7,'F');
 doc.setFont('helvetica','bold'); doc.setFontSize(9); doc.setTextColor(...MUTED); doc.text('MATRÍCULA',17,currentY); doc.text('DESCRIPCIÓN',70,currentY); currentY+=8;
 doc.setFont('helvetica','normal'); doc.setFontSize(8); doc.setTextColor(...TEXT);
 data.forEach((platform,index)=>{
 if(index%2===0){doc.setFillColor(252,253,255);doc.rect(15,currentY-3,180,6,'F');}
 doc.text(platform.matricula.toUpperCase(),17,currentY);
 if(platform.contenido){
 const lines=doc.splitTextToSize(platform.contenido.toUpperCase(),120);
 doc.text(lines,70,currentY);
 if(lines.length>1) currentY+=(lines.length-1)*3;
 }
 currentY+=6;
 if(currentY>bottomMargin){ doc.addPage(); currentY=30; }
 });
 return currentY+10;
 }
 if(cargadas.length>0||vacias.length>0){ yPosition=createTwoColumnTables('PLATAFORMAS CARGADAS',cargadas,'PLATAFORMAS VACÍAS',vacias,yPosition); }
 if(averiadas.length>0){ yPosition=createSingleTable('PLATAFORMAS AVERIADAS',averiadas,yPosition); }
 const pageCount=doc.internal.getNumberOfPages();
 for(let i=1;i<=pageCount;i++){
 doc.setPage(i); doc.setFont('helvetica','normal'); doc.setFontSize(8); doc.setTextColor(100,100,110);
 doc.text('© 2026 XPO LOGISTICS – Informe interno',20,285);
 doc.setTextColor(60,90,180);
 doc.textWithLink('CODE.COM', 105, 285, { url: 'https://vbenyx.github.io/XPO/', align: 'center' });
 doc.setTextColor(100,100,110); doc.text('Página '+i+' de '+pageCount,190,285,{align:'right'});
 }
 const exportDateForName = new Date().toLocaleDateString('es-ES', { day:'2-digit', month:'2-digit', year:'numeric' }).replace(/\//g,'-');
 doc.save('reporte_plataformas_'+exportDateForName+'.pdf');
}
(function installClearHold(){
 const clearBtn = $('clearAll'); if(!clearBtn) return;
 let clearTimer = null; let progressBar = null;
 // create visual bar inside button
 function ensureBar(){
 if(progressBar) return progressBar;
 progressBar = document.createElement('div');
 progressBar.id = 'clearHoldBar';
 progressBar.style.position = 'absolute';
 progressBar.style.left = '0'; progressBar.style.bottom = '0'; progressBar.style.height = '3px';
 progressBar.style.width = '0%'; progressBar.style.background = 'rgba(255,59,48,0.95)';
 progressBar.style.borderRadius = '2px';
 progressBar.style.transition = 'width .08s linear';
 clearBtn.style.position = 'relative';
 clearBtn.appendChild(progressBar);
 return progressBar;
 }
 function startHold(){
 if(!plataformas.length){ showIsland('No hay registros para limpiar',1200); return; }
 const bar = ensureBar(); bar.style.width='0%';
 let start = performance.now();
 clearTimer = setInterval(()=>{
 const p = Math.min(1, (performance.now()-start)/1400);
 bar.style.width = Math.round(p*100)+'%';
 if(p >= 1){
 // confirmed clear
 clearInterval(clearTimer); clearTimer = null;
 plataformas = []; saveData(); updateAll(); bar.style.width='0%';
 showIsland('Registros eliminados',1400);
 }
 }, 80);
 }
 function cancelHold(){ if(clearTimer){ clearInterval(clearTimer); clearTimer = null; const b = $('clearHoldBar'); if(b) b.style.width='0%'; showIsland('Acción cancelada',900); } }
 clearBtn.addEventListener('pointerdown', (e)=>{ e.preventDefault(); startHold(); });
 ['pointerup','pointercancel','pointerleave'].forEach(ev => clearBtn.addEventListener(ev, cancelHold));
})();
document.addEventListener('click', (e)=>{
 const qaBtn = e.target.closest('.qa');
 if(qaBtn){
 const rec = e.target.closest('.record'); if(!rec) return;
 const id = Number(rec.getAttribute('data-id')); const act = qaBtn.getAttribute('data-action');
 if(act === 'edit') { openEditModal(id); return; }
 if(act === 'delete') { deleteRecord(id); return; }
 return;
 }
 // Toggle record expand when clicking row (except when clicking action buttons)
 const row = e.target.closest('.record');
 if(row && !e.target.closest('.qa') && !e.target.closest('.action-btn')) {
 const content = row.querySelector('.content'); const actions = row.querySelector('.actions');
 const expanded = row.classList.toggle('expanded');
 if(content) content.style.display = expanded? 'block' : 'none';
 if(actions) actions.style.display = expanded? 'flex' : 'none';
 }
});
window.addEventListener('DOMContentLoaded', ()=>{
 loadData(); updateAll();
 // Restaurar borrador si existe
 const matInput = $('matriculaInput');
 const contInput = $('contenidoInput');
 try{
 const raw = localStorage.getItem('draft');
 if(raw){
 const d = JSON.parse(raw);
 if(d.m && matInput) matInput.value = d.m;
 if(d.c && contInput) contInput.value = d.c;
 }
 }catch(e){}
 // Autosave borrador
 const saveDraft = ()=>{
 try{
 const payload = {
 m: matInput ? matInput.value : '',
 c: contInput ? contInput.value : ''
 };
 localStorage.setItem('draft', JSON.stringify(payload));
 }catch(e){}
 };
 if(matInput) matInput.addEventListener('input', saveDraft);
 if(contInput) contInput.addEventListener('input', saveDraft);
 // Buscador en registros
 const searchInput = $('searchInput');
 if(searchInput){
 searchInput.addEventListener('input', ()=>{
 searchQuery = searchInput.value || '';
 renderCompactList();
 });
 }
 // Attach pressed effect to interactive elements
 document.querySelectorAll('.btn, .action-btn, .qa, .menu-trigger').forEach(attachPressedEffect);
 // Flow listeners
 $('toS2')?.addEventListener('click', nextFromS1);
 $('back1')?.addEventListener('click', ()=>{ showStep(1,'back'); keepCardInView(); });
 $('back2')?.addEventListener('click', ()=>{ showStep(2,'back'); keepCardInView(); });
 $('btnCargada')?.addEventListener('click', ()=>chooseEstado('CARGADA'));
 $('btnVacia')?.addEventListener('click', ()=>chooseEstado('VACÍA'));
 $('btnAveriada')?.addEventListener('click', ()=>chooseEstado('AVERIADA'));
 $('btnRegistrar')?.addEventListener('click', registrar);
 // Modal edit buttons
 $('editCancel')?.addEventListener('click', closeEditModal);
 $('editSave')?.addEventListener('click', saveEdit);
 document.addEventListener('keydown', (e)=>{ if(e.key==='Escape'){ closeEditModal(); } });
 // Segment filter buttons in compact header
 document.querySelectorAll('.compact-header [data-tab]').forEach(btn=>{
 btn.addEventListener('click', ()=>{
 document.querySelectorAll('.compact-header [data-tab]').forEach(b=>b.classList.remove('active'));
 btn.classList.add('active');
 currentTab = btn.getAttribute('data-tab') || 'TODAS';
 updateAll();
 });
 });
 // genPdf (wraps generatePDF)
 $('genPdf')?.addEventListener('click', ()=>{ keepCardInView(); generatePDF(); });
 // clearAll listeners are installed in the self-invoked installer above
 // small safety: prevent duplicate jsPDF loads (console warn)
 const scripts = Array.from(document.querySelectorAll('script[src*="jspdf"]'));
 if(scripts.length > 1) console.warn('jsPDF aparece cargado más de una vez - deja sólo una carga para reducir peso.');
 // keep header shadow on scroll
 window.addEventListener('scroll', ()=>{ if(window.scrollY>10) document.body.classList.add('scrolled'); else document.body.classList.remove('scrolled'); });
});
</script>
<script>
(function(){
 const origUpdate=updateAll;
 updateAll=function(){
 origUpdate();
 const avg = plataformas.filter(p=>p.estado==='AVERIADA').length;
 const badge=document.getElementById('callBadge');
 const btn=document.querySelector('button[data-tab="CALL"]');
 if(avg>0){
 if(badge) badge.style.display='inline-block';
 if(btn) btn.classList.add('call-alert');
 }else{

<script>
(function(){
 const lista = Object.keys(plataformas || {});
 if(!lista.length) return;
 const input = document.getElementById('matricula');
 if(!input) return;
 const box = document.createElement('div');
 box.style.position = 'absolute';
 box.style.background = 'rgba(255,255,255,0.9)';
 box.style.backdropFilter = 'blur(18px)';
 box.style.border = '1px solid rgba(210,210,220,0.8)';
 box.style.borderRadius = '14px';
 box.style.padding = '6px 0';
 box.style.boxShadow = '0 14px 26px rgba(0,0,0,0.15)';
 box.style.zIndex = '2000';
 box.style.display = 'none';
 box.style.maxHeight = '200px';
 box.style.overflowY = 'auto';
 document.body.appendChild(box);
 function positionBox(){
 const r = input.getBoundingClientRect();
 box.style.left = r.left + 'px';
 box.style.top = (r.bottom + window.scrollY + 6) + 'px';
 box.style.width = r.width + 'px';
 }
 input.addEventListener('input', ()=>{
 const val = input.value.toUpperCase();
 positionBox();
 if(!val){
 box.style.display = 'none';
 return;
 }
 const matches = lista.filter(m => m.includes(val));
 if(!matches.length){
 box.style.display = 'none';
 return;
 }
 box.innerHTML = matches.map(m=>\`<div style="
 padding:10px 14px;
 cursor:pointer;
 font-size:14px;
 transition:background .2s;">
 \${m}
 </div>\`).join('');
 [...box.children].forEach(div=>{
 div.addEventListener('mouseover',()=>div.style.background="rgba(10,132,255,0.15)");
 div.addEventListener('mouseout',()=>div.style.background="transparent");
 div.addEventListener('click',()=>{
 input.value = div.innerText.trim();
 box.style.display='none';
 });
 });
 box.style.display = 'block';
 });
 document.addEventListener('click',(e)=>{
 if(!box.contains(e.target) && e.target!==input){
 box.style.display='none';
 }
 });
})();
</script>

<script>
document.addEventListener('mousemove', e=>{
 document.querySelectorAll('.dynamic-light').forEach(el=>{
 const r = el.getBoundingClientRect();
 const x = ((e.clientX - r.left) / r.width) * 100;
 const y = ((e.clientY - r.top) / r.height) * 100;
 el.style.setProperty('--mX', x + '%');
 el.style.setProperty('--mY', y + '%');
 });
});
window.addEventListener('DOMContentLoaded', ()=>{
 document.querySelectorAll('.card, .panel, .compact, #flowCard, header')
 .forEach(el=> el.classList.add('fade-in'));
});
function animateCounters(){
 const items = document.querySelectorAll('.count-num');
 items.forEach(el=>{
 const target = parseInt(el.innerText);
 el.innerText = "0";
 el.classList.add("count-animate");
 let curr = 0;
 const step = Math.max(1, Math.floor(target/30));
 const intv = setInterval(()=>{
 curr += step;
 if(curr >= target){
 el.innerText = target;
 clearInterval(intv);
 } else el.innerText = curr;
 }, 20);
 });
}
setTimeout(animateCounters, 900);
</script>
<div id='clearEffect'></div>
<script>
(function(){
 const effect = document.getElementById('clearEffect');
 function triggerClearEffect(){
 effect.innerHTML = "";
 const w = window.innerWidth;
 const h = window.innerHeight;
 // Add flash
 const flash = document.createElement('div');
 flash.className = 'flash';
 effect.appendChild(flash);
 // Add particles
 for(let i=0;i<60;i++){
 const p = document.createElement('div');
 p.className = 'particle';
 p.style.left = (w/2) + "px";
 p.style.top = (h/2) + "px";
 const angle = Math.random()*2*Math.PI;
 const dist = 200 + Math.random()*180;
 const dx = Math.cos(angle)*dist + "px";
 const dy = Math.sin(angle)*dist + "px";
 p.style.setProperty('--dx', dx);
 p.style.setProperty('--dy', dy);
 effect.appendChild(p);
 }
 effect.style.display = "block";
 setTimeout(()=>{ effect.style.display="none"; },650);
 }
 // Hook into your clear-records button action
 const clearBtn = document.querySelector("#btnClearAll, .btn-clear-all");
 if(clearBtn){
 clearBtn.addEventListener('click', ()=>{
 triggerClearEffect();
 });
 }
})();
</script>
